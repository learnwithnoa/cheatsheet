name: Around the world (fallback)
# Every morning: if Claude's daily task didn't add today's 3 pieces to world.json, add simple ones (holiday, NASA, fun fact).
on:
  schedule:
    - cron: "15 13 * * *"   # 10:15 in Chile (summer time); Claude's task runs earlier
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world-json
  cancel-in-progress: false
jobs:
  fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add today's pieces if missing
        run: python3 tools/world_fallback.py
      - name: Save
        run: |
          git config user.name "hibi-bot"; git config user.email "hibi-bot@users.noreply.github.com"
          git add world.json
          git diff --cached --quiet || (git commit -m "Around the world: fallback for $(TZ=America/Santiago date +%F)" && (git push || (git pull --rebase && git push)))

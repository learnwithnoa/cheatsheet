name: Podcast audio
# Copies club podcast episodes from Google Drive into pod/<drive-id>.mp3 (small, speech-quality MP3),
# so Hibi can play them with its own player. Add a Drive file id as a line in pod/queue.txt and push.
on:
  push:
    paths: ["pod/queue.txt"]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours: picks up new episodes added to Hibi
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and convert
        env:
          HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
        run: |
          set -e
          touch pod/queue.txt
          if [ -n "$HUB_PASSWORD" ]; then
            echo "Hibi password: set"
            python3 tools/hubsync.py club-episodes > /tmp/eps.json 2>/dev/null || echo "[]" > /tmp/eps.json
            python3 -c "import json,re;[print(m.group(1)) for e in json.load(open('/tmp/eps.json')) for m in [re.search(r'drive\.google\.com/(?:file/d/|open\?id=)([\w-]{20,})',e.get('url',''))] if m]" >> pod/queue.txt || true
          else echo "Hibi password: MISSING"; fi
          echo "Queue:"; cat pod/queue.txt
          for id in $(grep -oE '[A-Za-z0-9_-]{20,}' pod/queue.txt | sort -u); do
            [ -f "pod/$id.mp3" ] && continue
            # ffmpeg only when there's a new episode (a short network blip used to fail every run), with retries
            if ! command -v ffmpeg >/dev/null; then
              for t in 1 2 3; do (sudo apt-get update -qq -o Acquire::Retries=3 && sudo apt-get install -y -qq -o Acquire::Retries=3 ffmpeg) && break; echo "apt failed, retrying"; sleep 30; done
            fi
            curl -sSL --fail -o /tmp/src "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t"
            file /tmp/src; ls -la /tmp/src
            ffmpeg -nostdin -loglevel error -y -i /tmp/src -ac 1 -ar 44100 -b:a 64k "pod/$id.mp3"
            ls -la "pod/$id.mp3"
          done
      - name: Commit
        run: |
          git config user.name "hibi-bot"; git config user.email "hibi-bot@users.noreply.github.com"
          git add pod/*.mp3 2>/dev/null || true; git checkout -- pod/queue.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Podcast audio" && git push)

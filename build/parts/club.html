<section class="view" id="v-club" hidden>
  <h1>Noa's English <em>Club</em></h1>
  <p class="lede">This week's classes, the community wall, your Zoom links and past weeks.</p>
  <div class="cl-wrap" id="clubMain"><p class="muted">Loading…</p></div>
</section>
<script>
(function(){
  const box=document.getElementById("clubMain"); if(!box) return;
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const TZ="America/Santiago", WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const SEEN="cs-club-seen";
  /* beginner mode: the club's buttons and labels in Spanish */
  const isBeg=()=>{ try{ const v=localStorage.getItem("ncs-level")||""; return v==="beginner"||v==='"beginner"'; }catch(e){ return false; } };
  const L=(en,es)=>isBeg()?es:en; window.__clL=L;
  let tab="week";
  const feed=()=>{ if(window.__csPreview&&window.__csPreview.kind==="private") return null; return window.__csClub||null; };
  const posts=f=>((f&&f.posts)||[]).filter(p=>p&&p.week).slice().sort((a,b)=>b.week.localeCompare(a.week));
  const seen=()=>{ try{ return localStorage.getItem(SEEN)||""; }catch(e){ return ""; } };
  const markSeen=id=>{ try{ localStorage.setItem(SEEN,id); }catch(e){} };
  /* class times are Chile time; show the member's own time too when it's different */
  function tzOff(tz,d){ const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{}); return (Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute)-d.getTime())/60000; }
  function chileAt(iso,hm){ const [y,m,d]=iso.split("-").map(Number), [h,mi]=String(hm||"20:00").split(":").map(Number); let t=Date.UTC(y,m-1,d,h,mi); t-=tzOff(TZ,new Date(t))*60000; t=Date.UTC(y,m-1,d,h,mi)-tzOff(TZ,new Date(t))*60000; return new Date(t); }
  const fmtT=(d,tz)=>d.toLocaleTimeString("en-US",Object.assign({hour:"numeric",minute:"2-digit"},tz?{timeZone:tz}:{}));
  const myTz=(()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||TZ; }catch(e){ return TZ; } })();
  function timeTxt(d){ const ch=fmtT(d,TZ); if(tzOff(myTz,d)===tzOff(TZ,d)) return ch+" (Chile)"; return ch+" Chile · "+fmtT(d)+" your time"; }
  const fd=iso=>{ const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}); };
  function sched(f,wd){ return ((f&&f.info&&f.info.schedule)||[]).find(s=>s.wd===wd)||null; }
  function weekDates(week){ const [y,m,d]=week.split("-").map(Number); return i=>{ const x=new Date(y,m-1,d+i); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }; }
  function classesOf(f,p){
    const at=weekDates(p.week);
    return (p.classes||[]).map((c,i)=>{ const wd=c.wd!=null?c.wd:Math.max(0,WD.indexOf(String(c.day||"").slice(0,3))); const s=sched(f,wd)||{}; const date=c.date||at((wd+6)%7); const start=chileAt(date,c.time||s.time||"20:00"); const end=new Date(start.getTime()+((c.dur||s.dur||90)*60000));
      return Object.assign({},s,c,{wd,date,start,end,ico:c.ico||s.ico||"📅",name:c.name||s.name||"",zoom:c.zoom||s.zoom||"",k:"k"+(((wd===1?1:wd===3?2:wd===4?3:4)))}); });
  }
  const planBtn=(date,wd)=>{ const d=new Date(date+"T12:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); const wk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    return ((window.__clubPlans||{})[wk]||[]).includes(Number(wd))?`<button type="button" class="cs-act cl-planb" data-plan="${wk}|${wd}" aria-expanded="false">📄 ${L("Class material","Material de la clase")}</button>`:""; };
  function clsCard(c,now,rs){
    const live=now>=c.start.getTime()-10*60000&&now<=c.end.getTime(), past=now>c.end.getTime(), today=new Date(c.start).toDateString()===new Date(now).toDateString();
    return `<div class="cl-cls ${c.k}${past?" past":""}"><div class="cl-when"><b>${c.ico} ${esc(fd(c.date))}</b><span>${esc(timeTxt(c.start))}</span>${live?'<span class="cl-live">● Live now</span>':today&&!past?'<span class="cl-today">Today</span>':""}</div>
      <h3>${esc(c.name)}${c.title?`: ${esc(c.title)}`:""}</h3>${c.teaser?`<p>${esc(c.teaser)}</p>`:""}
      <div class="cl-cact">${c.zoom&&!past?`<a class="cl-join" href="${esc(c.zoom)}" target="_blank" rel="noopener">${live?L("🎥 Join now","🎥 Entrar ahora"):"🎥 Zoom link"}</a>`:""}${rs&&!past?`<span class="cl-rsvp" data-rsvp="${esc(rs)}" data-wd="${c.wd}"></span>`:""}${past?planBtn(c.date,c.wd):""}</div></div>`;
  }
  function postHTML(f,p,now,head,cur){
    return `<article class="cl-post">${head?`<div class="cl-meta">${L("Week of","Semana del")} ${esc(fd(p.week))}</div>`:""}${p.title?`<h2>${esc(p.title)}</h2>`:""}${p.intro?`<p class="cl-intro">${esc(p.intro)}</p>`:""}
      ${(p.classes||[]).length?`<div class="cl-classes">${classesOf(f,p).map(c=>clsCard(c,now,cur?p.week:"")).join("")}</div>`:""}${p.closing?`<p class="cl-closing">${esc(p.closing)}</p>`:""}${recapHTML(p)}${chalHTML(p,cur)}</article>`;
  }
  /* after class: recordings, notes, words and phrases (added by Noa's nightly helper) */
  function recapHTML(p){ const r=p.recap; if(!r) return ""; const recs=r.recordings||[], voc=r.vocab||[], ph=r.phrases||[]; if(!recs.length&&!voc.length&&!ph.length&&!r.notes) return "";
    return `<div class="cl-recap"><h3>🎬 ${L("After class","Después de clase")}</h3>${recs.length?`<div class="cl-recs">${recs.map(x=>`<a class="cl-rec" href="${esc(x.url)}" target="_blank" rel="noopener"><span>▶</span><b>${esc(x.title||L("Recording","Grabación"))}</b>${x.wd!=null?`<small>${WD[x.wd]}</small>`:""}</a>`).join("")}</div>`:""}
      ${r.notes?`<p class="cl-rnote">${esc(r.notes)}</p>`:""}
      ${voc.length?`<h4>📚 ${L("Words from class","Palabras de la clase")}</h4><ul class="cl-voc">${voc.map((v,i)=>`<li><span><b>${esc(v.w)}</b>${v.tr?` <i>· ${esc(v.tr)}</i>`:""}${v.ex?`<br><small>“${esc(v.ex)}”</small>`:""}</span><button type="button" class="cl-addw" data-clw="${esc(JSON.stringify({w:v.w,tr:v.tr||"",ex:v.ex||""}))}">＋ ${L("My words","Mis palabras")}</button></li>`).join("")}</ul>`:""}
      ${ph.length?`<h4>💬 ${L("Useful phrases","Frases útiles")}</h4><div class="cl-phr">${ph.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`:""}</div>`; }
  /* weekly challenge: Noa's prompt + members' answers (filled by the community script) */
  function chalHTML(p,cur){ const c=p.challenge; if(!c||!(c.title||c.prompt)) return "";
    return `<div class="cl-chal"><div class="cl-chal-h"><span class="cl-chal-ic" aria-hidden="true">✍️</span><div><div class="cl-meta">${L("Weekly challenge","Desafío semanal")}</div><h3>${esc(c.title||"")}</h3></div></div>${c.prompt?`<p>${esc(c.prompt)}</p>`:""}<div class="cl-chal-list" data-chal="${esc(p.id)}" data-cur="${cur?1:""}"></div></div>`; }
  function nav(){
    const f=feed(), b=document.getElementById("navClub"); if(b){ const signed=window.__csAuth===true||!!window.__csGuest||!!window.__csPreview; b.hidden=!f&&!signed; b.classList.toggle("locked",!f); b.title=f?"":"Club members only"; const ps=posts(f); let dot=b.querySelector(".club-dot"); const n=ps[0]&&ps[0].id!==seen()&&!window.__csPreview; if(n&&!dot){ dot=document.createElement("span"); dot.className="club-dot"; dot.title="New this week"; b.appendChild(dot); } else if(!n&&dot) dot.remove(); }
    home();
  }
  function home(){
    const hc=document.getElementById("homeClub"); if(!hc) return; const f=feed(), p=posts(f)[0];
    if(!f||!p){ hc.hidden=true; return; }
    const now=Date.now(), cl=classesOf(f,p), isNew=p.id!==seen();
    const next=cl.find(c=>now<=c.end.getTime());
    hc.hidden=false; hc.className="hc-club"; setTimeout(homeWall,0);
    hc.innerHTML=`<div class="hc-h"><b>🌼 This week in the club${isNew&&!window.__csPreview?'<span class="hc-new">NEW</span>':""}</b><button type="button" class="hc-go" data-go="club">Open →</button></div>
      <div class="hc-list">${cl.map(c=>`<div class="${now>c.end.getTime()?"past":""}"><span class="d">${c.ico} ${WD[c.wd]} ${esc(fmtT(c.start,TZ).replace(":00",""))}</span><span>${esc(c.name)}${c.title?`: ${esc(c.title)}`:""}</span></div>`).join("")}</div>
      <button type="button" class="hc-wall" data-hcwall="1" hidden></button>${(()=>{ const r=recList(f).filter(it=>!watched().includes(it.id)&&Date.now()-new Date(it.date+"T12:00:00").getTime()<8*864e5)[0]; return r?`<button type="button" class="hc-wall" data-recgo="${esc(r.id)}">🎬 ${L("New recording:","Nueva grabación:")} ${esc(r.c.name||r.x.title||"")} →</button>`:""; })()}
      ${next&&next.zoom&&now>=next.start.getTime()-10*60000?`<a class="cl-join" style="--k:#E5533D" href="${esc(next.zoom)}" target="_blank" rel="noopener">🎥 ${esc(next.name)} is live: join now</a>`:""}`;
  }
  /* not a club member: a locked page with what the club is, how to join, and this week's topics (no Zoom links) */
  let PUB=null, pubTried=false;
  async function loadPublic(){ if(pubTried) return; pubTried=true;
    try{ const F=window.__csFire; if(!F) return; const tok=await F.token(); if(!tok) return;
      const r=await fetch(F.base+"/clubPublic/week",{headers:{Authorization:"Bearer "+tok}}); if(!r.ok) return; const d=await r.json(); PUB=JSON.parse(d.fields.json.stringValue); render(); }catch(e){} }
  function locked(){
    const lede=document.querySelector("#v-club .lede"); if(lede) lede.hidden=true;
    const now=Date.now(), p=PUB&&PUB.post, f2=PUB?{info:PUB.info||{}}:null;
    box.innerHTML=`<div class="cl-lock"><div class="cl-lock-h"><h2>Club members only</h2><div class="cl-lock-badge" aria-hidden="true">🔒</div></div>
      <p>Noa’s English Club is where you practice speaking with other learners every week, in a relaxed, friendly group. It’s for B1 to C1 learners: fluency and confidence first, grammar second.</p>
      <ul class="cl-lock-list"><li>🧠 <b>Deep Dive Monday</b> · a thought-provoking topic, often with a short video</li><li>🃏 <b>Wildcard Wednesday</b> · games and activities, pure speaking</li><li>💬 <b>Word Up Thursday</b> · useful expressions, then conversation</li><li>😎 <b>Free Talk Friday</b> · relaxed conversation to close the week</li></ul>
      <p class="cl-lock-small">Members get every weekly class, the community wall to chat with other members, all past class recordings, the weekly club podcast 🎧, and our 📸 Instagram group to keep practicing (and send memes) between classes.</p>
      <a class="cl-join-btn" href="mailto:learnwithnoa@gmail.com?subject=${encodeURIComponent("I want to join Noa's English Club 💛")}&body=${encodeURIComponent("Hi Noa! I'd like to join the club.\n\nMy name: "+((window.__csFire&&window.__csFire.name&&window.__csFire.name())||"")+"\nMy level (if I know it): \n\n")}">💛 I want to join</a><p class="cl-lock-small">Tap the button to email Noa, and he’ll send you everything you need. Prefer Instagram? <a href="https://ig.me/m/learnwithnoa" target="_blank" rel="noopener">Message @learnwithnoa</a>.</p></div>
      ${p?`<div class="cl-lock-week"><div class="cl-meta">${L("This week’s classes · preview","Clases de esta semana · vista previa")}</div>${p.title?`<h2>${esc(p.title)}</h2>`:""}<div class="cl-classes">${classesOf(f2,p).map(c=>clsCard(Object.assign({},c,{zoom:""}),now)).join("")}</div></div>`:""}`;
    loadPublic();
  }
  /* ---------- 🎬 recordings library: every recorded class, with its class page ---------- */
  const WKEY="cs-club-watched";
  const watched=()=>{ try{ return JSON.parse(localStorage.getItem(WKEY)||"[]"); }catch(e){ return []; } };
  function setWatched(id,on){ let w=watched().filter(x=>x!==id); if(on) w.push(id); try{ localStorage.setItem(WKEY,JSON.stringify(w)); }catch(e){} try{ window.__clubSocial&&window.__clubSocial.watched&&window.__clubSocial.watched(w); }catch(e){} }
  function recList(f){ const out=[]; posts(f).forEach(p=>{ const r=p.recap||{}, cl=classesOf(f,p); (r.recordings||[]).forEach((x,i)=>{ const c=cl.find(y=>y.wd===x.wd)||(x.wd!=null?(()=>{ const s=sched(f,x.wd)||{}; return {name:s.name,ico:s.ico,date:weekDates(p.week)((x.wd+6)%7)}; })():{});
      out.push({id:p.week+"_"+(x.wd!=null?x.wd:"r"+i),week:p.week,p,x,c:Object.assign({},c,{ico:(sched(f,x.wd)||{}).ico||c.ico}),date:c.date||p.week}); }); });
    /* recordings Noa added by hand (YouTube links), with or without a weekly post */
    (window.__clubRecs||[]).forEach(r=>{ if(!r||!r.url||!r.date) return; const d=new Date(r.date+"T12:00:00"), wd=d.getDay(), mon=new Date(d); mon.setDate(d.getDate()-((wd+6)%7)); const wk=mon.getFullYear()+"-"+String(mon.getMonth()+1).padStart(2,"0")+"-"+String(mon.getDate()).padStart(2,"0");
      const p=posts(f).find(x=>x.week===wk), s=sched(f,r.wd!=null?r.wd:wd)||{}, pc=p?classesOf(f,p).find(y=>y.wd===(r.wd!=null?r.wd:wd)):null;
      const id="yt_"+r.id; if(out.some(o=>o.x.url===r.url)) return;
      out.push({id,week:wk,p:p||{recap:{},title:""},x:{url:r.url,title:r.name||s.name,summary:r.summary||"",wd:r.wd!=null?r.wd:wd,rid:r.id,diff:r.diff,diffWhy:r.diffWhy},c:{name:r.name||(pc&&pc.name)||s.name||"",title:r.topic||(pc&&pc.title)||"",ico:s.ico||(pc&&pc.ico)||"🎬",teaser:pc&&pc.teaser,date:r.date},date:r.date}); });
    return out.sort((a,b)=>b.date.localeCompare(a.date)); }
  /* difficulty 1-10 for club material (1 ≈ A2+, 10 ≈ C1) */
  const DLV=n=>n<=2?"A2+":n<=4?"B1":n<=6?"B1+":n<=8?"B2":n<=9?"B2+":"C1";
  function diffHTML(o){ const n=+(o&&o.diff)||0; if(!n) return ""; return `<span class="cl-diff" title="${esc((o.diffWhy?o.diffWhy+" · ":"")+L("Difficulty for club members: 1 is about A2+, 10 is about C1","Dificultad para el club: 1 es como A2+, 10 es como C1"))}"><span class="cl-dbar" aria-hidden="true">${Array.from({length:10},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</span><b>${n}/10</b><small>${DLV(n)}</small><span class="sr">${L("Difficulty","Dificultad")} ${n} ${L("of","de")} 10</span></span>`; }
  const ytId=u=>{ const m=String(u||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/); return m?m[1]:""; };
  function recCard(it,open){ const x=it.x, c=it.c, r=it.p.recap||{}, w=watched().includes(it.id), voc=r.vocab||[], ph=r.phrases||[];
    const name=c.name||x.title||L("Class","Clase"), topic=c.title&&c.name?c.title:"", q=[name,topic,x.title,x.summary,c.teaser,it.p.title,voc.map(v=>v.w).join(" ")].join(" ").toLowerCase();
    return `<details class="cl-rcard${w?" seen":""}" data-rid="${esc(it.id)}" data-q="${esc(q)}"${open?" open":""}><summary><span class="cl-rico" aria-hidden="true">${esc(c.ico||"🎬")}</span><span class="cl-rt"><b>${esc(name)}${topic?`: ${esc(topic)}`:""}</b><small>${esc(fd(it.date))}${voc.length?` · 📚 ${voc.length} ${L("words","palabras")}`:""}${x.diff?` · ${L("Level","Nivel")} ${+x.diff}/10`:""}</small></span>${w?`<span class="cl-wtick" title="${L("Watched","Vista")}">✓</span>`:""}</summary>
      <div class="cl-rbody">${ytId(x.url)?`<button type="button" class="cl-yt" data-yt="${ytId(x.url)}" data-watched="${esc(it.id)}" aria-label="${L("Play the recording","Reproducir la grabación")}"><img src="https://i.ytimg.com/vi/${ytId(x.url)}/hqdefault.jpg" alt="" loading="lazy"><span class="cl-ytp" aria-hidden="true">▶</span></button>`:""}<div class="cl-ract"><a class="cl-watch" href="${esc(x.url)}" target="_blank" rel="noopener" data-watched="${esc(it.id)}">▶ ${L("Watch the recording","Ver la grabación")}</a>${planBtn(it.date,x.wd)}<span class="cl-recfav" data-recfav="rec_${esc(it.id)}"></span><button type="button" class="cs-act" data-wtoggle="${esc(it.id)}" aria-pressed="${w}">${w?L("✓ Watched","✓ Vista"):L("Mark as watched","Marcar como vista")}</button>${x.rid&&isNoaNow()?`<button type="button" class="cs-act" data-recdel="${esc(x.rid)}">✕ Remove</button>`:""}</div>
        ${diffHTML(x)}${x.summary||c.teaser?`<p>${esc(x.summary||c.teaser)}</p>`:`<p class="cl-planintro" data-pintro="${esc(it.date)}"></p>`}
        ${voc.length?`<h4>📚 ${L("Words from that week","Palabras de esa semana")}</h4><ul class="cl-voc">${voc.map(v=>`<li><span><b>${esc(v.w)}</b>${v.tr?` <i>· ${esc(v.tr)}</i>`:""}${v.ex?`<br><small>“${esc(v.ex)}”</small>`:""}</span><button type="button" class="cl-addw" data-clw="${esc(JSON.stringify({w:v.w,tr:v.tr||"",ex:v.ex||""}))}">＋ ${L("My words","Mis palabras")}</button></li>`).join("")}</ul>`:""}
        ${ph.length?`<h4>💬 ${L("Useful phrases","Frases útiles")}</h4><div class="cl-phr">${ph.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}</div></details>`; }
  let RFOCUS=null;
  /* ---------- 🎧 the weekly club podcast (episodes stored in clubStats/_podcast: Noa adds, members listen) ---------- */
  const pods=()=>(window.__clubPods||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||(b.at||0)-(a.at||0));
  function podPlayer(u){ u=String(u||""); const yt=ytId(u); { const dm=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{20,})/); if(dm) return `<div class="cl-pplay" data-drive="${dm[1]}"><button type="button" class="cl-pbtn" data-pplay="1" aria-label="${L("Play","Reproducir")}">▶</button><div class="cl-pmid"><input type="range" class="cl-pbar" min="0" max="1000" value="0" aria-label="${L("Position","Posición")}"><div class="cl-ptime"><span data-pt="cur">0:00</span><span data-pt="dur">–:––</span></div></div><button type="button" class="cs-act cl-pskip" data-pskip="-15" aria-label="${L("Back 15 seconds","Atrás 15 segundos")}">↺ 15</button><button type="button" class="cs-act cl-pskip" data-pskip="15" aria-label="${L("Forward 15 seconds","Adelante 15 segundos")}">15 ↻</button><button type="button" class="cs-act cl-pspeed" data-pspeed="1">1×</button><label class="cl-pvolw" title="${L("Volume","Volumen")}"><button type="button" class="cl-pmute" data-pmute="1" aria-label="${L("Mute","Silenciar")}">🔊</button><input type="range" class="cl-pvol" min="0" max="100" value="100" aria-label="${L("Volume","Volumen")}"></label><audio preload="metadata" src="pod/${dm[1]}.mp3" data-alt="https://drive.usercontent.google.com/download?id=${dm[1]}&export=download&confirm=t"></audio></div>`; } if(yt) return `<button type="button" class="cl-yt" data-yt="${yt}" data-watched="pod_${yt}" aria-label="${L("Play the episode","Reproducir el episodio")}"><img src="https://i.ytimg.com/vi/${yt}/hqdefault.jpg" alt="" loading="lazy"><span class="cl-ytp" aria-hidden="true">▶</span></button>`;
    let m=u.match(/open\.spotify\.com\/(episode|show)\/([\w]+)/); if(m) return `<iframe class="cl-podsp" src="https://open.spotify.com/embed/${m[1]}/${m[2]}" title="Podcast episode" loading="lazy" allow="encrypted-media; clipboard-write; fullscreen; picture-in-picture"></iframe>`;
    m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]{20,})/); if(m) return `<iframe class="cl-poddr" src="https://drive.google.com/file/d/${m[1]}/preview" title="Podcast episode" loading="lazy" allow="autoplay"></iframe>`;
    if(/\.(mp3|m4a|wav|ogg|aac)(\?|$)/i.test(u)) return `<audio class="cl-podau" controls preload="none" src="${esc(u)}"></audio>`;
    return `<a class="cl-watch" href="${esc(u)}" target="_blank" rel="noopener">🎧 ${L("Listen","Escuchar")}</a>`; }
  function podHTML(f){ const ps=pods(), noa=isNoaNow();
    const add=noa?`<details class="cl-podadd"><summary>＋ Add an episode <span class="muted">(only you see this)</span></summary><form class="cl-recform" data-podform="1"><label>Link to the episode<input name="url" type="url" required placeholder="Google Drive, YouTube or Spotify link"></label><div class="cl-rf2"><label>Week of (Monday)<input name="date" type="date" required value="${weekOf(Date.now())}"></label><label>Title<input name="title" maxlength="120" placeholder="e.g. Pets, interviews & animal verbs"></label></div><label>Show notes <span class="muted">(optional: what we cover, new words)</span><textarea name="notes" rows="3" maxlength="1500"></textarea></label><div class="cs-row"><span class="cs-msg" role="status"></span><button type="submit" class="cs-send">Add the episode</button></div><p class="cl-note">Google Drive: share the audio file as “Anyone with the link can view”, then paste its link.</p></form></details>`:"";

  /* smart suggestions: people you've interacted with (DMs, replies, reactions, mentions, duels), plus Noa, always */
  function dmSuggest(){ const my=G()?"me":me(), sc=new Map(), why=new Map(), names=new Map(dmPeople());
    const bump=(u,n,w)=>{ if(!u||u===my||u===me()) return; sc.set(u,(sc.get(u)||0)+n); if(w&&!(why.get(u)||[]).includes(w)) why.set(u,(why.get(u)||[]).concat(w)); };
    (THREADS||[]).forEach(t=>bump(otherOf(t),3,"💬"));
    (NOTES||[]).forEach(n=>bump(n.uid,n.kind==="react"?2:3,n.kind==="react"?"❤️":n.kind==="mention"?"@":"↩️"));
    (POSTS||[]).forEach(p=>{ (p.likes||[]).forEach(v=>{ const [u]=rxOf(v); if(p.uid===my) bump(u,2,"❤️"); else if(u===my) bump(p.uid,2,"❤️"); });
      (COMM[p.id]||[]).forEach(c=>{ if(c.uid===my) bump(p.uid,3,"↩️"); else if(p.uid===my) bump(c.uid,3,"↩️"); (c.likes||[]).forEach(v=>{ const [u]=rxOf(v); if(c.uid===my) bump(u,1,"❤️"); else if(u===my) bump(c.uid,1,"❤️"); }); }); });
    (PARK||[]).forEach(x=>{ const u=x.me?my:x.uid; (x.dz||[]).forEach(z=>{ if(u===my) bump(z.to,4,"⚔️"); else if(z.to===me()) bump(u,4,"⚔️"); }); });
    let list=[...sc].filter(([u])=>names.get(u)).sort((a,b)=>b[1]-a[1]).map(([u])=>u).slice(0,6);
    if(my!==NOA&&!list.includes(NOA)) list.splice(Math.min(list.length,2),0,NOA);   /* Noa is always there: near the top, not necessarily first */
    if(list.length<4){ (POSTS||[]).forEach(p=>{ if(list.length<6&&p.uid&&p.uid!==my&&p.uid!==me()&&!list.includes(p.uid)&&names.get(p.uid)) list.push(p.uid); }); }
    return list.slice(0,7).map(u=>[u,names.get(u)||"Noa",u===NOA&&!(why.get(u)||[]).length?["🎓"]:(why.get(u)||[])]); }
  function dmSugHTML(){ const l=dmSuggest(); if(!l.length) return "";
    return `<div class="cl-dmsug"><div class="cl-dmsugh">${L("Suggested","Sugerencias")}</div><div class="cl-dmsugr">${l.map(([u,n,w])=>`<button type="button" class="cl-dmsc" data-dmto="${esc(u)}" data-dmname="${esc(n)}" title="${esc(n)}">${av(u,n)}<b>${esc(String(n).split(" ")[0])}</b>${w.length?`<small>${w.slice(0,2).join(" ")}</small>`:""}</button>`).join("")}</div></div>`; }
  const fold=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  document.addEventListener("input",e=>{ const i=e.target.closest("#dmFind"); if(!i) return; const ul=i.parentNode.querySelector(".cl-dmfind"), q=fold(i.value.trim());
    if(!q){ ul.hidden=true; ul.innerHTML=""; return; }
    const hits=dmPeople().filter(([,n])=>fold(n).split(/\s+/).some(w=>w.startsWith(q))||fold(n).includes(q)).sort((a,b)=>(b[0]===NOA)-(a[0]===NOA)||a[1].localeCompare(b[1])).slice(0,8);
    ul.hidden=false; ul.innerHTML=hits.length?hits.map(([u,n])=>`<li><button type="button" class="cl-dmi" data-dmto="${esc(u)}" data-dmname="${esc(n)}">${av(u,n)}<span><b>${esc(n)}</b>${u===NOA?`<small>${L("Teacher","Profe")}</small>`:""}</span></button></li>`).join(""):`<li class="muted cl-dmnone">${L("Nobody with that name in the club yet.","Nadie con ese nombre en el club todavía.")}</li>`; });
  document.addEventListener("keydown",e=>{ if(e.key!=="Enter"||!e.target.closest("#dmFind")) return; e.preventDefault(); const f=e.target.parentNode.querySelector(".cl-dmfind [data-dmto]"); if(f) f.click(); });
  function msgHTML(m){ const mine=m.from===(G()?"me":me());
    return `<div class="cl-msg${mine?" mine":""}">${m.text?`<p>${txtHTML(m.text)}</p>`:""}${(m.imgs||[]).map(i=>`<img data-img="${esc(i)}" alt="${L("Photo","Foto")}" class="cl-msgimg">`).join("")}${(m.gifs||[]).map(g=>`<img src="${esc(g.url||g)}" alt="GIF" class="cl-msgimg">`).join("")}<em>${new Date(m.at).toLocaleString(L("en-US","es-CL"),{hour:"numeric",minute:"2-digit",month:"short",day:"numeric"})}</em></div>`; }
  async function openChat(u,nm){ if(!u||u===me()) return; if(!G()&&!me()){ toast(L("Sign in first.","Primero inicia sesión.")); return; }
    const o=dmPanel(), b=o.querySelector(".cl-dmb"), tid=G()?"me_"+u:tidOf(me(),u); DMOPEN={tid,u,nm};
    o.querySelector(".cl-dmback").hidden=false; o.querySelector(".cl-dmt").innerHTML=`${av(u,nm)} ${esc(nm||L("Member","Miembro"))}`;
    b.innerHTML=`<div class="cl-msgs" aria-live="polite"><p class="cs-load">${L("Loading…","Cargando…")}</p></div>${composer("dm",u,L("Write a message…","Escribe un mensaje…"))}`;
    const ta=b.querySelector("textarea"); if(ta){ ta.rows=2; ta.focus(); ta.addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); ta.form.requestSubmit(); } }); }
    await paintChat(true); clearInterval(DMTIMER); DMTIMER=setInterval(async()=>{ if(!(document.getElementById("clDm")&&DMOPEN&&!document.hidden)) return; if(G()){ paintChat(false); return; }
      /* check the thread's "last message" time (1 read) and only reload the messages when something new arrived */
      try{ const t=DMOPEN.tid, r=await api("GET","/dms/"+t), at=r&&r.fields&&r.fields.at?Number(r.fields.at.integerValue||r.fields.at.doubleValue||0):0; if(!DMOPEN||DMOPEN.tid!==t) return; if(at&&at===DMOPEN.lastAt) return; DMOPEN.lastAt=at; paintChat(false); }catch(e){} },15000); }
  async function paintChat(scroll){ if(!DMOPEN) return; const {tid}=DMOPEN, box=document.querySelector("#clDm .cl-msgs"); if(!box) return; let ms=[];
    if(G()) ms=[{from:DMOPEN.u,text:"Hi! Are you coming on Wednesday? 😊",at:H(3)},{from:"me",text:"Yes! See you there 👋",at:H(2)}];
    else { try{ ms=await query("dms/"+tid,"msgs","ASCENDING",300); }catch(e){ ms=[]; } }
    const near=box.scrollHeight-box.scrollTop-box.clientHeight<80;
    box.innerHTML=ms.length?ms.map(msgHTML).join(""):`<p class="cl-empty">${L("Say hi 👋","Saluda 👋")}</p>`; paintImgs(box); if(scroll||near) box.scrollTop=box.scrollHeight;
    if(!G()&&ms.length&&ms[ms.length-1].from!==me()){ try{ await api("PATCH",`/dms/${tid}?updateMask.fieldPaths=r_${me()}`,{fields:{["r_"+me()]:I(Date.now())}}); const t=(THREADS||[]).find(x=>x.id===tid); if(t) t.unread=false; dmBadge(); }catch(e){} } }
  async function sendDm(form,text,files,gif){ const u=form.dataset.target, tid=tidOf(me(),u), now=Date.now();
    const ids=[]; for(const f of files){ ids.push(await uploadImg(f)); }
    const names={[me()]:F().name()||"",[u]:(DMOPEN&&DMOPEN.nm)||(profOf(u)||{}).name||""};
    await api("PATCH",`/dms/${tid}?updateMask.fieldPaths=members&updateMask.fieldPaths=json&updateMask.fieldPaths=at&updateMask.fieldPaths=r_${me()}`,{fields:{members:{arrayValue:{values:[me(),u].sort().map(S)}},json:S(JSON.stringify({names,last:{text:text.slice(0,120)||(gif?"GIF":"📷"),from:me(),at:now}})),at:I(now),["r_"+me()]:I(now)}});
    const data={text}; if(ids.length) data.imgs=ids; if(gif) data.gifs=[gif];
    await api("POST",`/dms/${tid}/msgs?documentId=${rid()}`,{fields:{from:S(me()),at:I(now),json:S(JSON.stringify(data))}});
    const t=(THREADS||[]).find(x=>x.id===tid); if(!t||!t.at||now-t.at>30*60000) note(u,"dm","dm:"+me(),text||"📷"); if(t){ t.at=now; t.last={text,from:me(),at:now}; } }
  window.__clubMyProfile=()=>{ if(!me()) return; if(location.hash!=="#club") location.hash="#club"; setTimeout(()=>openProfile(me()),200); };
  window.__clubDM=(u,nm)=>{ if(location.hash!=="#club") location.hash="#club"; setTimeout(()=>openChat(u,nm),u?150:0); };
  window.__clubInbox=()=>openInbox();
  document.addEventListener("click",e=>{ const t=e.target.closest("[data-dmto]"); if(t){ e.preventDefault(); document.querySelector(".cl-prof-ov")?.remove(); openChat(t.dataset.dmto,t.dataset.dmname); return; }
    if(e.target.closest("[data-dmback]")){ openInbox(); return; }
    if(e.target.closest("[data-dminbox]")){ openInbox(); return; } });
  window.__clubSocial={ mount, dms:loadThreads, recent, refreshBadge, unread, reports, delReport, watched:syncWatched };
  const b=document.getElementById("clubMain"); if(b) mount(b);
})();
</script>

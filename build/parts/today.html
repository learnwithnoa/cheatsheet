<p class="lede">Your word of the day, class notes and new words, all in one place.</p>
  <div class="today" id="todayBox">
    <div class="card today-word">
      <div class="td-top"><span class="tag td-tag">Word of the day</span><span class="count" id="tdDate"></span></div>
      <div class="tw-row"><span class="tw-w" id="twWord"></span><button class="say" type="button" id="twSay" aria-label="Hear it">🔊</button></div>
      <div class="tw-m" id="twMean"></div>
      <div class="tw-ex" id="twEx"></div>
      <div class="tw-watch" id="twWatch" hidden></div>
      <div class="note-actions"><button class="pill-btn pill-green" type="button" id="twSave">+ Save to my words</button></div>
    </div>
    <div class="card today-thought">
      <span class="tag td-tag2">Thought for today</span>
      <p class="tt" id="ttText"></p>
    </div>
  </div>

<section class="view" id="v-coaching" hidden>
  <h1>My <em>coaching</em></h1>
  <p class="lede">Your private classes with Noa: your next class, homework, guides, class recaps, goals and your pack. Noa keeps it up to date after your classes.</p>
  <div class="ch-wrap" id="coachBox"><p class="muted">Loading…</p></div>
</section>
<script>
(function(){
  const box=document.getElementById("coachBox"); if(!box) return;
  let tab="classes", cSort=-1, wSort="new", openRep=null;
  /* progress reports: ?report=<id>#coaching from the email opens that report */
  const REP_P="cs-open-report", REP_READ="cs-rep-read";
  try{ const q=new URLSearchParams(location.search).get("report"); if(q){ sessionStorage.setItem(REP_P,q.replace(/[^\w-]/g,"").slice(0,30)); history.replaceState(null,"",location.pathname+"#coaching"); } }catch(e){}
  const repRead=()=>{ try{ return JSON.parse(localStorage.getItem(REP_READ)||"[]")||[]; }catch(e){ return []; } };
  const markRepRead=id=>{ try{ const r=repRead(); if(!r.includes(id)){ r.push(id); localStorage.setItem(REP_READ,JSON.stringify(r.slice(-40))); } }catch(e){} };
  const repsOf=v=>((v&&v.reports)||[]).filter(r=>r&&r.id).slice().sort((a,b)=>(b.to||"").localeCompare(a.to||""));
  function repHTML(r,forPrint){
    const L=(arr,f)=>(arr||[]).length?arr.map(f).join(""):"";
    return `${r.snapshot?`<p class="ch-rp-snap">${esc(r.snapshot)}</p>`:""}
      ${(r.clicking||[]).length?`<div class="ch-rp-sec"><h4>✅ What’s clicking</h4>${L(r.clicking,c=>`<div class="ch-rp-win"><b>${esc(c.win)}</b>${c.example?`<small>${esc(c.example)}</small>`:""}</div>`)}</div>`:""}
      ${(r.topics||[]).length?`<div class="ch-rp-sec"><h4>💬 Topics we covered</h4><div class="ch-rp-chips">${L(r.topics,x=>`<span>${esc(x)}</span>`)}</div></div>`:""}
      ${(r.patterns||[]).length?`<div class="ch-rp-sec"><h4>🔎 Speaking patterns worth noting</h4><ul>${L(r.patterns,x=>`<li>${esc(x)}</li>`)}</ul></div>`:""}
      ${(r.focus||[]).length?`<div class="ch-rp-sec"><h4>🎯 What to focus on next</h4>${L(r.focus,f=>`<div class="ch-rp-foc"><b>${esc(f.area)}</b>${f.tip?`<div>💡 ${esc(f.tip)}</div>`:""}</div>`)}</div>`:""}
      ${r.resource?`<div class="ch-rp-sec"><h4>📚 Resource pick</h4>${r.resource.url&&!forPrint?`<a class="ch-rp-res" href="${esc(r.resource.url)}" target="_blank" rel="noopener"><b>${esc(r.resource.title)} ↗</b>${r.resource.why?`<small>${esc(r.resource.why)}</small>`:""}</a>`:`<div class="ch-rp-res"><b>${esc(r.resource.title)}</b>${r.resource.url?`<small>${esc(r.resource.url)}</small>`:""}${r.resource.why?`<small>${esc(r.resource.why)}</small>`:""}</div>`}</div>`:""}
      ${r.month?`<div class="ch-rp-sec"><h4>🔭 Zooming out: your month at a glance</h4><p>${esc(r.month)}</p></div>`:""}
      ${r.closing?`<p class="ch-rp-close">${esc(r.closing)}<br>— Noa</p>`:""}
      ${(r.recordings||[]).length&&!forPrint?`<div class="ch-rp-sec"><h4>🎥 Your class recordings</h4><div class="ch-rp-recs">${L(r.recordings,x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">▶ ${esc(x.label||("Class on "+fs(x.date)))}</a>`)}</div></div>`:""}`;
  }
  function printRep(r){
    const w=window.open("","_blank"); if(!w){ if(window.toast) window.toast("Allow pop-ups to print"); return; }
    w.document.write(`<!doctype html><meta charset="utf-8"><title>Progress report · ${esc(fs(r.from))} – ${esc(fs(r.to))}<\/title><style>body{font:15px/1.55 system-ui,sans-serif;color:#111;max-width:720px;margin:32px auto;padding:0 20px}h1{font-size:22px;margin:0 0 4px}h4{margin:18px 0 6px;font-size:15px}.m{color:#555;margin:0 0 14px}.ch-rp-snap{font-size:16px}.ch-rp-win,.ch-rp-foc,.ch-rp-res{margin:0 0 8px}.ch-rp-win small,.ch-rp-res small{display:block;color:#555}.ch-rp-chips span{display:inline-block;border:1px solid #ccc;border-radius:99px;padding:1px 9px;margin:0 4px 4px 0;font-size:13px}.ch-rp-close{font-style:italic;margin-top:20px}<\/style><h1>Your progress report</h1><p class="m">${esc(window.__csHubView&&window.__csHubView.name||"")} · ${esc(fd(r.from))} – ${esc(fd(r.to))} · ${r.sessions} ${r.sessions===1?"class":"classes"}</p>${repHTML(r,true)}`);
    w.document.close(); setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} },300);
  }
  /* ===== class recaps & study guides hosted on Hibi, with interactive exercises (?lesson=<id>#coaching opens one) ===== */
  const LES_P="cs-open-lesson", LES_K="ncs-lesson-prog";
  let openLes=null;
  try{ const q=new URLSearchParams(location.search).get("lesson"); if(q){ sessionStorage.setItem(LES_P,q.replace(/[^\w-]/g,"").slice(0,60)); history.replaceState(null,"",location.pathname+"#coaching"); } }catch(e){}
  const lesOf=v=>((v&&v.lessons)||[]).filter(x=>x&&x.id);
  /* ===== English Map (from Session Zero; ?map#coaching opens it) ===== */
  const MAP_P="cs-open-map";
  try{ const sp=new URLSearchParams(location.search); if(sp.has("map")){ sessionStorage.setItem(MAP_P,"1"); history.replaceState(null,"",location.pathname+"#coaching"); } }catch(e){}
  const LV=["A1","A2","B1","B2","C1","C2"];
  const MODNM={prs:"Present simple",ps:"Past simple",pp:"Present perfect",ed:"-ed endings"};
  function mapHTML(v){ const m=v.map||{}, lv=String(m.level||v.level||"").toUpperCase().match(/[ABC][12]/), cur=lv?lv[0]:"", first=(v.name||"").split(" ")[0];
    const nextRev=(m.reviews||[]).filter(d=>!(m.reviewed||[]).includes(d)).sort()[0];
    const route=(m.route||[]).slice(0,4);
    const RICO={read:"📖",listen:"🎧",words:"📝",watch:"🎬",speak:"🗣️",write:"✍️"};
    return `<div class="em" id="emView"><button type="button" class="ch-tab lx-back" data-mapback="1">← Back to My coaching</button>
    <header class="em-hd"><div><div class="em-k">Your English Map</div><h2>${esc(first)}, here's where you are and where we're going</h2>${m.date?`<p class="em-sub">From Session Zero · ${esc(fd(m.date))}</p>`:""}</div>
      ${cur?`<div class="em-lv" role="img" aria-label="Your level: ${cur}">${LV.map(l=>`<span class="${l===cur?"on":LV.indexOf(l)<LV.indexOf(cur)?"past":""}">${l}${l===cur?"<i>you</i>":""}</span>`).join("")}</div>`:""}</header>
    ${m.where?`<section class="em-sec"><h3>📍 Where you are now</h3><p>${md(m.where)}</p></section>`:""}
    ${m.power?`<section class="em-sec em-power"><h3>⭐ Your superpower: ${esc(m.power.title||"")}</h3>${m.power.quote?`<blockquote>“${esc(m.power.quote)}”</blockquote>`:""}${m.power.note?`<p>${md(m.power.note)}</p>`:""}</section>`:""}
    ${(m.focus||[]).length?`<section class="em-sec"><h3>🎯 Your 3 focus areas</h3><ol class="em-focus">${m.focus.map((f,i)=>`<li><div class="em-fn">${i+1}</div><div><b>${esc(f.t||"")}</b>
      ${f.said||f.fix?`<div class="em-fx">${f.said?`<span class="em-said"><small>You said</small><s>${esc(f.said)}</s></span>`:""}${f.fix?`<span class="em-fix"><small>${f.said?"Try":"Say it like this"}</small>${esc(f.fix)}</span>`:""}</div>`:""}
      ${f.tip?`<p class="em-tip">💡 ${md(f.tip)}</p>`:""}${f.mod&&MODNM[f.mod]?`<button type="button" class="ch-go" data-go="quiz">Practice: ${esc(MODNM[f.mod])}${f.stage?" · stage "+(+f.stage):""} →</button>`:""}</div></li>`).join("")}</ol></section>`:""}
    ${route.length||m.goal?`<section class="em-sec"><h3>🚀 Where we're going</h3><ol class="em-route"><li class="em-now"><span class="em-dot"></span><small>Today</small><b>${cur?cur+" · ":""}your starting point</b></li>${route.map(r=>`<li><span class="em-dot"></span><small>${esc(r.when||"")}</small><b>${esc(r.what||"")}</b></li>`).join("")}${m.goal?`<li class="em-goal"><span class="em-dot">🏁</span><small>Your goal</small><b>${esc(m.goal)}</b></li>`:""}</ol></section>`:""}
    ${(m.routine||[]).length?`<section class="em-sec"><h3>📚 Your routine <span class="em-muted">15–20 minutes a day</span></h3><div class="em-rt">${m.routine.map(r=>{ const ico=RICO[String(r.k||"").toLowerCase()]||"✨", inner=`<span aria-hidden="true">${ico}</span><small>${esc(r.k||"")}</small><b>${esc(r.v||"")}</b>`; return /^https:\/\//.test(r.url||"")?`<a class="em-rc" href="${esc(r.url)}" target="_blank" rel="noopener">${inner}</a>`:`<div class="em-rc">${inner}</div>`; }).join("")}</div></section>`:""}
    ${m.how||m.dayone||nextRev?`<section class="em-sec em-foot">${m.how?`<p><b>🧭 How we get there.</b> ${md(m.how)}</p>`:""}${m.dayone?`<p><b>📸 Your day one.</b> ${md(m.dayone)}</p>`:""}${nextRev?`<p class="em-next">🗓️ We'll look at this map together again around <b>${esc(fd(nextRev))}</b>.</p>`:""}</section>`:""}
    <p class="em-sign">Let's go, ${esc(first)}. Noa</p></div>`; }
  let openMap=false;
  const lprog=()=>{ try{ return JSON.parse(localStorage.getItem(LES_K)||"{}")||{}; }catch(e){ return {}; } };
  const lsave=(id,p)=>{ if(window.__csViewAsMode) return; try{ const all=lprog(); all[id]=p; localStorage.setItem(LES_K,JSON.stringify(all)); }catch(e){} try{ window.__csOnSet&&window.__csOnSet(LES_K); }catch(e){} };
  const md=t=>esc(t).replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\*([^*]+)\*/g,"<i>$1</i>");
  const NRM=t=>String(t||"").toLowerCase().replace(/[‘’`´]/g,"'").replace(/[“”]/g,'"')
    .replace(/\bcan't\b/g,"cannot").replace(/\bwon't\b/g,"will not").replace(/n't\b/g," not").replace(/'ve\b/g," have").replace(/'m\b/g," am").replace(/'re\b/g," are").replace(/'ll\b/g," will")
    .replace(/[.,!?;:"()]/g," ").replace(/\s+/g," ").trim();
  const same=(a,b)=>NRM(a)===NRM(b);
  function lesTotal(L){ return (L.exercises||[]).reduce((n,x)=>n+x.items.length,0); }
  function lesScore(L,p){ let ok=0; (L.exercises||[]).forEach((x,i)=>x.items.forEach((_,j)=>{ if((p.ok||{})[i+"-"+j]===true) ok++; })); return ok; }
  function blanks(q){ return String(q).split(/_{2,}/); }
  function exItem(L,x,i,j,p){ const k=i+"-"+j, it=x.items[j], ok=(p.ok||{})[k], ans=(p.ans||{})[k], tried=ok!==undefined, show=(p.show||{})[k];
    const mark=ok===true?'<span class="lx-mark lx-good" aria-label="Correct">✓</span>':tried?'<span class="lx-mark lx-bad" aria-label="Not yet">✗</span>':"";
    const note=it.note&&tried?`<div class="lx-note">💡 ${md(it.note)}</div>`:"";
    if(x.type==="choice"){ const parts=blanks(it.q);
      return `<li class="lx-it${ok===true?" lx-good":tried?" lx-bad":""}" data-k="${k}"><div class="lx-q">${parts.length>1?md(parts[0])+'<span class="lx-blank">'+(ok===true?esc(it.opts[it.a]):"____")+"</span>"+md(parts.slice(1).join("____")):md(it.q)} ${mark}</div>
        <div class="lx-opts">${it.opts.map((o,n)=>`<button type="button" class="lx-opt${ans===n?(n===it.a?" lx-good":" lx-bad"):""}${ok===true&&n===it.a?" lx-good":""}" data-lxopt="${n}" ${ok===true?"disabled":""}>${esc(o)}</button>`).join("")}</div>${note}</li>`; }
    if(x.type==="gap"){ const parts=blanks(it.q), vals=Array.isArray(ans)?ans:[];
      return `<li class="lx-it${ok===true?" lx-good":tried?" lx-bad":""}" data-k="${k}"><div class="lx-q lx-gapq">${parts.map((t,n)=>md(t)+(n<parts.length-1?`<input type="text" class="lx-in" data-b="${n}" value="${esc(vals[n]||"")}" aria-label="Blank ${n+1}" autocomplete="off" autocapitalize="off" spellcheck="false" ${ok===true?"disabled":""} size="${Math.max(8,Math.min(22,((it.a[n]||[""])[0]||"").length+2))}">`:"")).join("")} ${mark}</div>
        ${tried&&ok!==true?`<div class="lx-fb">${show?`<span class="lx-ans">✅ ${it.a.map(a=>esc(a[0])).join(" · ")}</span>`:`<button type="button" class="lx-link" data-lxshow="1">Show the answer</button>`}</div>`:""}${note}</li>`; }
    return `<li class="lx-it${ok===true?" lx-good":tried?" lx-bad":""}" data-k="${k}"><div class="lx-q">${md(it.q)} ${mark}</div>
      <textarea class="lx-in lx-ta" rows="2" aria-label="Your answer" ${ok===true?"disabled":""} spellcheck="false">${esc(ans||"")}</textarea>
      ${tried&&ok!==true?`<div class="lx-fb">${show?`<span class="lx-ans">✅ ${it.a.map(esc).join(" <i>or</i> ")}</span>`:`<span>Not quite yet. Try again, or </span><button type="button" class="lx-link" data-lxshow="1">see a good answer</button>`}</div>`:ok===true&&it.a.length&&!it.a.some(a=>same(a,ans))?`<div class="lx-fb"><span class="lx-ans">Also good: ${esc(it.a[0])}</span></div>`:""}${note}</li>`; }
  function lessonHTML(L){ const p=lprog()[L.id]||{}, tot=lesTotal(L), sc=lesScore(L,p);
    let have=new Set(); try{ have=new Set((JSON.parse(localStorage.getItem("ncs-words")||"[]")||[]).map(x=>String(x&&x.w||"").toLowerCase().trim())); }catch(e){}
    const sec=s=>{ if(s.type==="list") return `<section class="lx-sec"><h3>${esc(s.h)}</h3><ul>${s.items.map(t=>`<li>${md(t)}</li>`).join("")}</ul></section>`;
      if(s.type==="fixes") return `<section class="lx-sec"><h3>${esc(s.h)}</h3><div class="lx-fixes">${s.rows.map(r=>`<div class="lx-fix"><div class="said"><small>You said</small><s>${md(r.said)}</s></div><div class="try"><small>Try instead</small><span>${md(r.try)}</span></div>${r.why?`<div class="why">${md(r.why)}</div>`:""}</div>`).join("")}</div>${s.bonus?`<p class="lx-bonus"><b>Bonus:</b> ${md(s.bonus)}</p>`:""}</section>`;
      if(s.type==="vocab"){ const un=s.items.filter(v=>!have.has(v.w.toLowerCase().trim())).length;
        return `<section class="lx-sec"><div class="lx-sech"><h3>${esc(s.h)}</h3>${un?`<button type="button" class="ch-go" data-lxsaveall="1">＋ Save all ${un} to My words</button>`:""}</div><div class="lx-voc">${s.items.map((v,n)=>{ const okw=have.has(v.w.toLowerCase().trim()); return `<div class="lx-w"><div><b>${esc(v.w)}</b>${v.pos?` <span class="lx-pos">${esc(v.pos)}</span>`:""}${v.tr?`<span class="lx-tr">${esc(v.tr)}</span>`:""}${v.ex?`<small>“${esc(v.ex)}”</small>`:""}</div><button type="button" class="ch-rc-save" data-lxw='${esc(JSON.stringify({w:v.w,tr:v.tr||"",ex:v.ex||""}))}' ${okw?"disabled":""}>${okw?"✓ Saved":"＋ Save"}</button></div>`; }).join("")}</div></section>`; }
      return `<section class="lx-sec"><h3>${esc(s.h)}</h3>${String(s.body||"").split(/\n{2,}/).map(par=>{ const ls=par.split("\n"); return ls.every(x=>/^\s*[-•]/.test(x))?`<ul>${ls.map(x=>`<li>${md(x.replace(/^\s*[-•]\s*/,""))}</li>`).join("")}</ul>`:`<p>${ls.map(md).join("<br>")}</p>`; }).join("")}</section>`; };
    return `<div class="lx" data-lesson-id="${esc(L.id)}"><button type="button" class="ch-tab lx-back" data-lxback="1">← Back to My coaching</button>
      <header class="lx-head ch-tint ${L.kind==="guide"?"ch-a":"ch-s"}"><div class="ch-k">${L.kind==="guide"?"📄 Study guide":"📼 Class recap"} · ${fd(L.date)}</div><h2>${esc(L.title)}</h2>${L.topic?`<p class="lx-topic"><b>Topic:</b> ${md(L.topic)}</p>`:""}${L.nutshell?`<p class="lx-nut">${md(L.nutshell)}</p>`:""}
        ${tot?`<div class="lx-prog"><div class="ch-bar"><i style="width:${Math.round(sc*100/tot)}%"></i></div><span>${sc}/${tot} exercises right${p.done?" · ✅ done":""}</span><button type="button" class="ch-go" data-lxjump="1">✏️ Go to the practice</button></div>`:""}</header>
      ${(L.sections||[]).map(sec).join("")}
      ${(L.exercises||[]).length?`<section class="lx-sec lx-practice" id="lxPractice"><h3>✏️ Practice time</h3><p class="muted">Hibi checks your answers as you go. Small differences like contractions (didn’t / did not) are fine.</p>
        ${L.exercises.map((x,i)=>`<div class="lx-part" data-part="${i}"><h4>${esc(x.h||"")}</h4><ol class="lx-items">${x.items.map((_,j)=>exItem(L,x,i,j,p)).join("")}</ol>${x.type!=="choice"?`<button type="button" class="ch-go lx-check" data-lxcheck="${i}">Check my answers</button>`:""}</div>`).join("")}</section>`:""}
      ${L.yourTurn?`<section class="lx-sec lx-turn ch-tint ch-v"><h3>🎤 Your turn</h3><p>${md(L.yourTurn)}</p></section>`:""}
      ${tot&&sc===tot?`<div class="lx-done">🎉 All ${tot} right! Great work.</div>`:""}</div>`; }
  function lesCheck(L,i){ const box2=document.querySelector(`.lx [data-part="${i}"]`); if(!box2) return; const x=L.exercises[i], p=lprog()[L.id]||{}; p.ans=p.ans||{}; p.ok=p.ok||{};
    x.items.forEach((it,j)=>{ const k=i+"-"+j, li=box2.querySelector(`[data-k="${k}"]`); if(!li||p.ok[k]===true) return;
      if(x.type==="gap"){ const vals=[...li.querySelectorAll("input[data-b]")].map(n=>n.value); if(vals.every(v=>!v.trim())) return; p.ans[k]=vals; p.ok[k]=vals.every((v,n)=>(it.a[n]||[]).some(a=>same(a,v))); }
      else { const v=(li.querySelector("textarea")||{}).value||""; if(!v.trim()) return; p.ans[k]=v; p.ok[k]=it.a.some(a=>same(a,v)); } });
    lesFinish(L,p); }
  function lesFinish(L,p){ const tot=lesTotal(L), sc=lesScore(L,p);
    if(tot&&sc===tot&&!p.done){ p.done=true; setTimeout(()=>{ try{ if(window.csBuddy&&window.csBuddy.treat) window.csBuddy.treat(5,"🎉 You finished every exercise!"); else if(window.toast) window.toast("🎉 You finished every exercise!"); }catch(e){} },300); }
    lsave(L.id,p); const y=window.scrollY; render(); window.scrollTo(0,y); }
  box.addEventListener("click",e=>{ const v=window.__csHubView; if(!v) return; const t=e.target;
    if(t.closest("[data-openmap]")){ e.preventDefault(); openMap=true; openLes=null; render(); window.scrollTo({top:0}); return; }
    if(t.closest("[data-mapback]")){ openMap=false; render(); window.scrollTo({top:0}); return; }
    const op=t.closest("[data-lesson]"); if(op){ e.preventDefault(); openLes=op.dataset.lesson; render(); window.scrollTo({top:0}); return; }
    if(!openLes) return; const L=lesOf(v).find(x=>x.id===openLes); if(!L) return;
    if(t.closest("[data-lxback]")){ openLes=null; render(); window.scrollTo({top:0}); return; }
    if(t.closest("[data-lxjump]")){ document.getElementById("lxPractice")?.scrollIntoView({behavior:"smooth",block:"start"}); return; }
    const o=t.closest("[data-lxopt]"); if(o){ const li=o.closest("[data-k]"), k=li.dataset.k, [i,j]=k.split("-").map(Number), it=L.exercises[i].items[j], n=+o.dataset.lxopt, p=lprog()[L.id]||{}; p.ans=p.ans||{}; p.ok=p.ok||{}; if(p.ok[k]===true) return; p.ans[k]=n; p.ok[k]=n===it.a; lesFinish(L,p); return; }
    const c=t.closest("[data-lxcheck]"); if(c){ lesCheck(L,+c.dataset.lxcheck); return; }
    const sh=t.closest("[data-lxshow]"); if(sh){ const k=sh.closest("[data-k]").dataset.k, p=lprog()[L.id]||{}; p.show=p.show||{}; p.show[k]=true; lsave(L.id,p); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
    const w=t.closest("[data-lxw]"); if(w){ let x={}; try{ x=JSON.parse(w.dataset.lxw); }catch(er){} if(window.csAddWord&&window.csAddWord(x.w,x.tr,x.ex)&&window.toast) window.toast("Saved to My words ✓"); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
    if(t.closest("[data-lxsaveall]")){ let n=0; (L.sections||[]).filter(s=>s.type==="vocab").forEach(s=>s.items.forEach(x=>{ if(window.csAddWord&&window.csAddWord(x.w,x.tr||"",x.ex||"")) n++; })); if(n&&window.toast) window.toast(`Saved ${n} words to My words ✓`); const y=window.scrollY; render(); window.scrollTo(0,y); return; } });
  /* if the page reloads (an update, a sync) while a recap is open, open it again where they were */
  addEventListener("pagehide",()=>{ if(openLes&&location.hash==="#coaching"&&!window.__csViewAsMode) try{ sessionStorage.setItem(LES_P,openLes); sessionStorage.setItem("cs-les-y",String(Math.round(scrollY))); }catch(e){} });
  /* typing keeps the answer even before "Check" (so a re-render never loses it) */
  box.addEventListener("input",e=>{ const v=window.__csHubView; if(!openLes||!v) return; const li=e.target.closest(".lx-it"); if(!li) return; const k=li.dataset.k, p=lprog()[openLes]||{}; p.ans=p.ans||{};
    const ins=li.querySelectorAll("input[data-b]"); p.ans[k]=ins.length?[...ins].map(n=>n.value):e.target.value; lsave(openLes,p); });

  function paint(){

    const KIND={private:["private student","tn-p"],both:["private + club","tn-b"],club:["club member","tn-c"],new:["private, not linked yet","tn-n"]};

    const packs=[];
    data.priv.filter(p=>p.status!=="inactive"&&p.status!=="paused").forEach(p=>{ const v=p.view||{}, du=v.due; if(!du) return; const nm=esc(v.name), id=esc(p.key.slice(4));
      let t=""; if(du.pending) t=`<b>${nm}</b>: pack not paid yet`; else if(du.left!=null&&du.left<=0) t=`<b>${nm}</b>: pack used up`; else if(du.classesLeft!=null&&du.classesLeft<=1) t=`<b>${nm}</b>: ${du.classesLeft} class left in the pack`; else if(du.half&&du.instAt&&du.nextNo>=du.instAt) t=`<b>${nm}</b>: 2nd payment due`;
      if(t) packs.push(`<li>💳 ${t} <a class="tn-go" href="private-students.html#s/${id}">Open →</a></li>`); });
    const clocks=[]; if(typeof window.__csTzRem==="function"){ const td=new Date(), ti=td.getFullYear()+"-"+String(td.getMonth()+1).padStart(2,"0")+"-"+String(td.getDate()).padStart(2,"0");
      data.priv.filter(p=>p.status==="active"&&p.view&&p.view.tz).forEach(p=>window.__csTzRem({name:p.view.name,tz:p.view.tz,country:p.view.country},ti,21,2).forEach(r=>clocks.push(`<li>🕐 ${esc(r.text)} <a class="tn-go" href="private-students.html#s/${esc(p.key.slice(4))}">Open →</a></li>`))); }
    const unl=data.acc.filter(a=>a.kind==="new").length;
    let hid=false; try{ hid=localStorage.getItem(HIDE)===dkey(); }catch(e){}
    const clubNew=(data.club||[]).filter(a=>a.at>since&&a.uid!=="J8D2tjQmBaaA2QN730tSfSrjfm73");
    const reps=data.reps||[], areq=data.areq||[];
    const cnt=areq.length+joins.length+packs.length+clocks.length+(unl?1:0)+clubNew.length+reps.length;

      ${areq.length?`<h4>🙋 Asking to join Hibi</h4><ul>${areq.map(r=>`<li><b>${esc(r.name)}</b> · ${esc(r.email)} <span class="muted">· ${esc(({club:"club member",private:"private student",joining:"wants to join",other:"other"})[r.who]||r.who||"")} · ${ago(r.at)}${r.n>1?` · asked ${r.n} times`:""}</span>${r.msg?`<div class="muted">“${esc(r.msg)}”</div>`:""}<div class="tn-acts"><button type="button" class="tn-btn" data-tnok="${esc(r.id)}">✓ Approve + email them</button><button type="button" class="tn-btn" data-tnno="${esc(r.id)}">Decline</button></div></li>`).join("")}</ul>`:""}

      ${clubNew.length?`<h4>Club community</h4><ul>${clubNew.map(a=>`<li>${a.kind==="post"?"📝":a.kind==="challenge"?"✍️":"💬"} <b>${esc(a.name)}</b> ${a.kind==="post"?"posted on the wall":a.kind==="challenge"?"answered the weekly challenge":/^w\d{8}$/.test(a.pid||"")?"commented on the weekly post":"commented on a post"}${a.img?" 📷":""}${a.text?`: <span class="muted">“${esc(a.text)}”</span>`:""} <span class="muted">· ${ago(a.at)}</span> <a class="tn-go" href="#club" data-go="club">Open →</a></li>`).join("")}</ul>`:""}
      ${joins.length||(showAll&&older.length)?`<h4>New on Hibi</h4><ul>${joins.map(a=>li(a,false)).join("")}${showAll?older.map(a=>li(a,true)).join(""):""}</ul>`:(!packs.length&&!unl&&!clocks.length&&!clubNew.length?`<p class="tn-line muted">Nothing new right now.</p>`:"")}
      ${older.length?`<button type="button" class="tn-link" data-tn="all">${showAll?"Hide earlier ones":`Show earlier sign-ups (${older.length})`}</button>`:""}
      ${unl?`<p class="tn-line">🔗 ${unl} ${unl===1?"account isn’t":"accounts aren’t"} linked to a student or the club yet. <a class="tn-go" href="members.html">Members page →</a></p>`:""}
      ${packs.length?`<h4>Packs</h4><ul>${packs.join("")}</ul>`:""}
      ${clocks.length?`<h4>Clock changes</h4><ul>${clocks.join("")}</ul>`:""}
      <p class="tn-line tn-more"><a class="tn-go" href="members.html">More student news (milestones, ✨ love, practice tips) on Members →</a></p></div>`;
  }
  /* access requests: approve = access/{email} + a ready-to-send Gmail invite */
  async function fsx(method,path,body){ const F=window.__csFire; const tok=await F.token(); const r=await fetch(F.base+path,{method,headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}); if(!r.ok) throw new Error(r.status); return r.status===204?null:r.json(); }
  async function accessReqs(){ if(!window.__csTeacher||window.__csPreview||!window.__csFire) return []; const j=await fsx("GET","/accessRequests?pageSize=100"); const v=f=>f?(f.stringValue!=null?f.stringValue:f.integerValue!=null?+f.integerValue:""):"";
    const all=((j&&j.documents)||[]).map(d=>({id:d.name.split("/").pop(),name:v(d.fields.name),email:String(v(d.fields.email)).trim().toLowerCase(),who:v(d.fields.who),msg:v(d.fields.msg),at:v(d.fields.at)})).sort((a,b)=>b.at-a.at);
    const by=new Map(); all.forEach(r=>{ const k=r.email||r.id, o=by.get(k); if(o){ o.ids.push(r.id); o.n++; if(!o.msg&&r.msg) o.msg=r.msg; } else by.set(k,Object.assign(r,{ids:[r.id],n:1})); });
    return [...by.values()]; }
  async function approve(name,email){ email=String(email).trim().toLowerCase(); await fsx("PATCH","/access/"+encodeURIComponent(email),{fields:{name:{stringValue:name},at:{integerValue:String(Date.now())},by:{stringValue:"noa"}}});
    const first=String(name).trim().split(/\s+/)[0]||"";
    const body=`Hi ${first}!\n\nYou're in! 🎉 Your Hibi account is ready.\n\n1. Open https://learnwithnoa.github.io/cheatsheet/\n2. Tap "Continue with Google" and use this email (${email}).\n\nOn your phone, you can add it to your home screen so it works like an app.\n\nSee you there!\nNoa`;
    window.open("https://mail.google.com/mail/?view=cm&fs=1&to="+encodeURIComponent(email)+"&su="+encodeURIComponent("You're in! Your Hibi access 🎉")+"&body="+encodeURIComponent(body),"_blank"); }
  document.addEventListener("click",async e=>{ const ok=e.target.closest("[data-tnok]"), no=e.target.closest("[data-tnno]"); if(!ok&&!no) return; const id=(ok||no).dataset.tnok||(ok||no).dataset.tnno, r=(data.areq||[]).find(x=>x.id===id); if(!r) return;
    try{ if(ok) await approve(r.name,r.email); for(const x of (r.ids||[id])) await fsx("DELETE","/accessRequests/"+encodeURIComponent(x)); }catch(er){ if(window.toast) window.toast("Couldn’t save that. Did you paste the new Firebase rules?"); return; }
    data.areq=data.areq.filter(x=>x.id!==id); open=true; paint(); if(window.toast) window.toast(ok?"✓ Approved. Send the email that just opened.":"Request removed"); });
  document.addEventListener("submit",async e=>{ const f=e.target.closest("[data-tninv]"); if(!f) return; e.preventDefault(); try{ await approve(f.name.value.trim(),f.email.value); }catch(er){ if(window.toast) window.toast("Couldn’t save that. Did you paste the new Firebase rules?"); return; } f.reset(); if(window.toast) window.toast("✓ Approved. Send the email that just opened."); });
  document.addEventListener("click",async e=>{ const r=e.target.closest("[data-tnrep]"); if(!r) return; try{ await window.__clubSocial.delReport(r.dataset.tnrep); }catch(er){ return; } data.reps=(data.reps||[]).filter(x=>x.id!==r.dataset.tnrep); open=true; paint(); });
  document.addEventListener("click",e=>{ const t=e.target.closest("[data-tn]"); if(!t) return; const k=t.dataset.tn;
    if(k==="open"){ open=!open; }

    else if(k==="undo"){ setSeen(undoPrev||0); undoPrev=null; open=true; }
    else if(k==="hide"){ open=false; undoPrev=null; }

  document.addEventListener("click",e=>{ if(open&&e.target.isConnected&&!e.target.closest("#tNotif")){ open=false; undoPrev=null; paint(); } });

  document.addEventListener("cs-teacher",()=>setTimeout(load,300));
  document.addEventListener("visibilitychange",()=>{ if(!document.hidden&&window.__csTeacher&&window.__csAway&&window.__csAway(300000)) load(); });
  window.__csNotifLoad=load; setTimeout(load,2000);
  /* clock-change helper (also used by My coaching) */
  if(typeof window.__csTzRem!=="function") import("./hubview.js?v=17").then(m=>{ window.__csTzRem=m.tzReminders; paint(); document.dispatchEvent(new CustomEvent("cs-hubview")); }).catch(()=>{});
})();

<script>
/* the student's English level, for level-adapted feedback: Noa's private-student level, or the club level Noa set from class recordings */
window.csLevel=function(){

  let c=null; try{ c=JSON.parse(localStorage.getItem("cs-cefr")||"null"); }catch(e){}
  if(c&&c.lv) return {lv:String(c.lv),src:"club"};
  let my=null; try{ my=JSON.parse(localStorage.getItem("ncs-mylevel")||"null"); }catch(e){}
  if(my&&my.lv) return {lv:String(my.lv),src:my.src||"self"};
  let b=null; try{ b=JSON.parse(localStorage.getItem("ncs-level")||"null"); }catch(e){}

<script>
/* My English level: a quick level check (20 questions, A1 to C1) or choose it yourself */
(function lvlInit(){
  const box=document.getElementById("lvlBox"); if(!box){ if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",lvlInit); return; }
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const BANDS=["A1","A2","B1","B2","C1"];
  const Q=[
    ["A1","She ___ a teacher.",["am","is","are"],1],["A1","I ___ coffee every morning.",["drink","drinks","drinking"],0],["A1","There ___ two cats in the garden.",["is","are","be"],1],["A1","___ you like pizza?",["Do","Does","Are"],0],

    ["B2","If I ___ more time, I would learn Japanese.",["have","had","would have"],1],["B2","The report ___ by the end of the day.",["will finish","will be finished","is finishing"],1],["B2","She suggested ___ a taxi.",["to take","taking","take"],1],["B2","I wish I ___ said that. It was a mistake.",["didn't","hadn't","wouldn't"],1],
    ["C1","No sooner ___ arrived than it started to rain.",["I had","had I","did I"],1],["C1","By this time next year, I ___ my degree.",["will finish","will have finished","finish"],1],["C1","The project was a success ___ the tight budget.",["despite","although","even though"],0],["C1","He's the colleague ___ advice I always follow.",["who","whose","whom"],1]
  ];

    const src={coach:"Noa set this as your coach",test:"from your level check"+(my&&my.at?" on "+fd(my.at):""),self:"you chose it",club:"Noa's estimate from the club classes"}[L.src]||"";
    box.innerHTML=`<div class="card lvl-now"><div class="lvl-big">${L.lv?esc(L.lv):"?"}</div><div><b>${L.lv?"Your level":"No level yet"}</b><div class="muted">${L.lv?esc(src):"Take the level check or choose your level below. Until then, Hibi assumes about B1."}</div>
      ${noa&&noa.lv&&L.src!=="club"&&!(v&&v.level)?`<div class="lvl-rec">💡 Noa's estimate from the Free Talk Friday classes: <b>${esc(noa.lv)}</b> <button type="button" class="swap" data-lvset="${esc(noa.lv)}" data-lvsrc="club">Use this</button></div>`:""}
      ${v&&v.level?`<div class="lvl-rec">🎓 As a private student, Noa's level for you is used for feedback. Your check still shows him how you're doing.</div>`:""}</div></div>
      <div class="lvl-opts"><div class="card"><h3>⏱ Level check</h3><p class="muted">20 quick questions, from easy to hard. About 5 minutes. Tap “I don't know” instead of guessing.</p><button class="pill-btn pill-green" type="button" data-lvstart>Start the level check</button>${my&&my.src==="test"&&my.score!=null?`<p class="muted small" style="margin:8px 0 0">Last time: ${my.score}/20 → ${esc(my.lv)}</p>`:""}</div>
      <div class="card"><h3>✋ Choose it yourself</h3><p class="muted">Not sure? A2 = simple everyday talk · B1 = you can explain and tell stories · B2 = you discuss most topics with some mistakes · C1 = you're fluent and precise.</p><div class="lvl-chips">${["A1","A2","A2-B1","B1","B1-B2","B2","C1","C2"].map(x=>`<button type="button" class="lvl-chip" data-lvset="${x}" data-lvsrc="self" aria-pressed="${my&&my.src==="self"&&my.lv===x}">${x}</button>`).join("")}</div>${my?`<button type="button" class="foot-link" data-lvclear>Clear my choice</button>`:""}</div></div>`;

  }
  function finish(){
    const c=BANDS.map(b=>Q.filter((x,i)=>x[0]===b&&run.a[i]===x[3]).length), score=c.reduce((n,x)=>n+x,0);
    let k=-1; for(let i=0;i<BANDS.length;i++){ if(c[i]>=3) k=i; else break; }

  });
  const v=document.getElementById("v-quiz"), panel=document.querySelector('[data-pp="level"]');

  document.addEventListener("cs-hubview",paintNow); setTimeout(paintNow,1500); paintNow();
})();

<script>
/* Noa's guest link: ?guest=hb7k2q (plain) or ?guest=hb7k2q&as=club (club member with a sample week) skips the sign-in screen in that tab */
(function(){
  const K="cs-guest";
  try{ const q=new URLSearchParams(location.search); if(q.get("guest")==="hb7k2q"){ sessionStorage.setItem(K,q.get("as")==="club"?"club":"plain"); history.replaceState(null,"",location.pathname+(location.hash||"")); } }catch(e){}
  let g=null; try{ g=sessionStorage.getItem(K); }catch(e){}
  if(g&&window.__csViewAsMode){ try{ sessionStorage.removeItem(K); }catch(e){} g=null; }  /* "View as" a real student = their real data, never the guest samples */
  if(!g) return;
  window.__csGuest=g;
  const SAMPLE_CLUB={info:{schedule:[{wd:1,ico:"🧠",name:"Deep Dive Monday",time:"20:00",dur:90,desc:"A thought-provoking topic, usually with a short video, then we talk about it."},{wd:3,ico:"🃏",name:"Wildcard Wednesday",time:"20:00",dur:90,desc:"Games and activities, pure speaking, no formal teaching."},{wd:4,ico:"💬",name:"Word Up Thursday",time:"20:00",dur:90,desc:"About 6 phrasal verbs, idioms or expressions on a theme, then conversation using them."},{wd:5,ico:"😎",name:"Free Talk Friday",time:"14:30",dur:60,host:"Laura",desc:"Relaxed conversation to close the week."}],links:[]},
    posts:[{id:"wsample",week:(()=>{ const d=new Date(), m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)); return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0"); })(),title:"✨ This week in the club (sample)",intro:"This is a sample week, so you can see how the Club page looks. Real members see the real post and Zoom links here.",
      classes:[{day:"Mon",ico:"🐾",name:"Deep Dive Monday",title:"A sample topic",teaser:"One or two lines about the class."},{day:"Wed",ico:"🎤",name:"Wildcard Wednesday",title:"A sample game",teaser:"One or two lines about the class."},{day:"Thu",ico:"🐴",name:"Word Up Thursday",title:"Sample expressions",teaser:"One or two lines about the class."},{day:"Fri",ico:"😎",name:"Free Talk Friday",title:"with Laura",teaser:"Relaxed conversation to close the week."}],closing:"See you in class! 🫰🏻",
      challenge:{title:"The best advice you ever got",prompt:"In 3–5 sentences: what's the best advice someone gave you, and how did it change something for you? Try to use the past simple."},
      recap:{recordings:[{wd:1,title:"Deep Dive Monday",url:"https://zoom.us/",summary:"We watched a short video on why pets make us feel safe, then shared stories about our own animals (and a few dream pets)."}],notes:"Great energy on Monday! We talked about pets and why animals make us feel safe.",vocab:[{w:"to look after",tr:"cuidar",ex:"My sister looks after my dog when I travel."},{w:"down to earth",tr:"con los pies en la tierra",ex:"She's very down to earth."}],phrases:["It makes me feel…","I can relate to that","That's a good point"]}},
      {id:"wsample0",week:(()=>{ const d=new Date(), m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)-7); return m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")+"-"+String(m.getDate()).padStart(2,"0"); })(),title:"Last week (sample)",classes:[{day:"Mon",ico:"🧠",name:"Deep Dive Monday",title:"Habits"},{day:"Fri",ico:"😎",name:"Free Talk Friday",title:"with Laura"}],
      recap:{recordings:[{wd:5,title:"Free Talk Friday",url:"https://zoom.us/"}],vocab:[{w:"to make a habit of",tr:"acostumbrarse a",ex:"I'm trying to make a habit of reading at night."}]}}]};
  if(g==="club"){ const put=()=>{ if(!window.__csClub){ window.__csClub=SAMPLE_CLUB; document.dispatchEvent(new CustomEvent("cs-club")); } }; document.addEventListener("cs-club",()=>setTimeout(put,0)); setTimeout(put,300); }
  const bar=()=>{ if(document.getElementById("guestBar")) return; const d=document.createElement("div"); d.id="guestBar"; d.setAttribute("role","status");
    d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:99999;background:#1f2937;color:#fff;font:600 13px system-ui,sans-serif;padding:8px 10px 8px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px)";
    d.innerHTML=`<span>👀 Guest preview${g==="club"?" · club member (sample week)":""} · nothing is saved to an account</span><button type="button" style="all:unset;cursor:pointer;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px">Exit</button>`;
    d.querySelector("button").onclick=()=>{ try{ sessionStorage.removeItem(K); }catch(e){} location.reload(); }; document.body.appendChild(d); };
  if(document.body) bar(); else document.addEventListener("DOMContentLoaded",bar);
})();
/* Hibi is invite-only: people ask for access (name + email, no Google yet), Noa approves, then they sign in with Google.
   Signed in but not approved yet → a "waiting for Noa" screen. Approved = access/{email} exists (or a teacher). */
(function(){
  if(window.__csPreview||window.__csGuest) return;
  const G='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>';
  const REQ_HOOK="https://formspree.io/f/xdegnkpp";   /* optional: a Formspree endpoint (https://formspree.io/f/xxxx) to also email Noa instantly */
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const OKK=u=>"cs-ok-"+u;
  let gate=null, mode="";
  function card(m){ const F=window.__csFire, em=F&&F.email?F.email():"";
    if(m==="pending") return `<div class="ag-logo" aria-hidden="true">Hibi <small lang="ja">日々</small></div>
      <h2 id="agTitle">Almost there!</h2>
      <p>You’re signed in as <b>${esc(em)}</b>, but Noa hasn’t opened Hibi for this email yet.</p>
      <p class="ag-es" lang="es">Iniciaste sesión, pero Noa aún no ha aprobado este correo.</p>
      ${reqForm(em,true)}
      <button type="button" class="ag-link" data-agout>Use another Google account</button>`;
    if(m==="sent") return `<div class="ag-logo" aria-hidden="true">Hibi <small lang="ja">日々</small></div>
      <h2 id="agTitle">Thanks! 🙌</h2><p>Noa got your request. He’ll email you as soon as you’re in (usually within a day). Then come back and sign in with Google using <b>the same email</b>.</p>
      <p class="ag-es" lang="es">¡Gracias! Noa recibió tu solicitud y te escribirá cuando estés dentro. Luego vuelve e inicia sesión con Google usando el mismo correo.</p>
      <button type="button" class="ag-btn ag-alt" data-signin>${G}<span>I’m approved: continue with Google</span></button>`;
    return `<div class="ag-logo" aria-hidden="true">Hibi <small lang="ja">日々</small></div>
      <h2 id="agTitle">Hibi is for Noa’s students</h2>
      <p>Ask for access below. Noa will email you when you’re in, and then you sign in with Google.</p>
      <p class="ag-es" lang="es">Hibi es para los alumnos de Noa. Pide acceso aquí: Noa te escribirá cuando estés dentro.</p>
      ${reqForm("",false)}
      <div class="ag-or"><span>Already approved?</span></div>
      <button type="button" class="ag-btn" data-signin>${G}<span>Continue with Google</span></button>
      <p class="ag-msg" id="agMsg" role="alert" hidden></p>
      <p class="ag-small">Hibi only uses your name and email to save your progress. Noa never sees your password.</p>`; }
  function reqForm(em,signed){ return `<form class="ag-form" data-agreq>
      <label>Your name<input name="name" required maxlength="80" autocomplete="name"></label>
      <label>Your email <small>(the Google account you’ll sign in with)</small><input name="email" type="email" required maxlength="120" autocomplete="email" value="${esc(em)}" ${signed?"readonly":""}></label>
      <label>I’m…<select name="who"><option value="club">In Noa’s English Club</option><option value="private">Taking private classes with Noa</option><option value="joining">Interested in joining</option><option value="other">Other</option></select></label>
      <label>Anything to add? <small>(optional)</small><textarea name="msg" rows="2" maxlength="500"></textarea></label>
      <button type="submit" class="ag-btn ag-send">Ask for access</button><p class="ag-fmsg" role="status"></p></form>`; }
  function show(m){
    if(window.__csPreview) return;
    if(!gate){ gate=document.createElement("div"); gate.id="authGate"; gate.setAttribute("role","dialog"); gate.setAttribute("aria-modal","true"); gate.setAttribute("aria-labelledby","agTitle"); document.body.appendChild(gate); }
    if(mode!==m||!gate.innerHTML){ mode=m; gate.innerHTML=`<div class="ag-card">${card(m)}</div>`; }
    gate.hidden=false; document.documentElement.classList.add("ag-lock");
    [...document.body.children].forEach(el=>{ if(el!==gate&&!el.matches("script")) el.inert=true; });
  }
  function hide(){
    if(gate) gate.hidden=true; document.documentElement.classList.remove("ag-lock");
    [...document.body.children].forEach(el=>{ if(el!==gate) el.inert=false; });
  }
  /* approved? (access/{email}); if the database can't say (e.g. rules not set up yet), let them in */
  async function approved(){ const F=window.__csFire; if(!F||!F.email) return true; const em=F.email(), uid=F.uid&&F.uid(); if(!em) return true;
    if(window.__csTeacher===true||em==="learnwithnoa@gmail.com") return true;
    try{ const tok=await F.token(); const r=await fetch(F.base+"/access/"+encodeURIComponent(em),{headers:{Authorization:"Bearer "+tok}});
      if(r.status===404) return false; if(r.ok) return true; return true; }catch(e){ return true; } }
  async function check(){ const F=window.__csFire, uid=F&&F.uid?F.uid():""; let cached=false; try{ cached=!!localStorage.getItem(OKK(uid)); }catch(e){}
    if(cached) hide(); else if(gate&&!gate.hidden) {} 
    const ok=await approved(); try{ if(ok) localStorage.setItem(OKK(uid),"1"); else localStorage.removeItem(OKK(uid)); }catch(e){}
    if(ok) hide(); else show("pending"); }
  const on=s=>{ if(s) check(); else show(mode==="sent"?"sent":"out"); };
  window.addEventListener("cs-auth",e=>on(!!(e.detail&&e.detail.signedIn)));
  if(window.__csAuth!=null) on(window.__csAuth);
  document.addEventListener("submit",async e=>{ const f=e.target.closest("[data-agreq]"); if(!f) return; e.preventDefault(); const F=window.__csFire, msg=f.querySelector(".ag-fmsg"), btn=f.querySelector("button");
    const d={name:f.name.value.trim(),email:f.email.value.trim().toLowerCase(),who:f.who.value,msg:f.msg.value.trim()};
    if(!d.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)){ msg.textContent="Please add your name and a valid email."; return; }
    if(!F||!F.base){ msg.textContent="Hibi is still loading. Try again in a moment."; return; }
    const ALREADY="You already asked with this email 🙌 Noa will email you as soon as you’re in, so there’s no need to send it again. / Ya enviaste tu solicitud con este correo: Noa te escribirá apenas estés dentro.";
    let asked=[]; try{ asked=JSON.parse(localStorage.getItem("cs-areq")||"[]")||[]; }catch(er){}
    if(asked.includes(d.email)){ msg.textContent=ALREADY; return; }
    btn.disabled=true; msg.textContent="Sending…";
    const S=v=>({stringValue:String(v)}), body=JSON.stringify({fields:{name:S(d.name),email:S(d.email),who:S(d.who),msg:S(d.msg),at:{integerValue:String(Date.now())}}});
    const remember=()=>{ try{ localStorage.setItem("cs-areq",JSON.stringify(asked.concat(d.email).slice(-5))); }catch(er){} };
    try{ /* one request per email: the email is the document id, so asking twice is refused by the database */
      let r=await fetch(F.base+"/accessRequests?documentId="+encodeURIComponent(d.email)+"&key="+encodeURIComponent(F.key||""),{method:"POST",headers:{"Content-Type":"application/json"},body});
      if(r.status===409){ remember(); btn.disabled=false; msg.textContent=ALREADY; return; }
      if(!r.ok) r=await fetch(F.base+"/accessRequests?key="+encodeURIComponent(F.key||""),{method:"POST",headers:{"Content-Type":"application/json"},body});
      if(!r.ok) throw new Error(r.status); }
    catch(er){ btn.disabled=false; msg.textContent="That didn’t go through. Try again, or message Noa on Instagram (@learnwithnoa)."; return; }
    remember();
    if(REQ_HOOK) fetch(REQ_HOOK,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(Object.assign({_subject:"🙋 Hibi access request: "+d.name},d))}).catch(()=>{});
    mode=""; show("sent"); });
  document.addEventListener("click",async e=>{ if(!e.target.closest("[data-agout]")) return; try{ const b=document.getElementById("signOut")||document.querySelector("[data-signout]"); if(b){ b.click(); return; } }catch(er){} if(window.csSignOut) window.csSignOut(); });
})();
</script>

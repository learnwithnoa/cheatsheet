<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Student Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800;900&family=Space+Mono&display=swap">
<style>
:root{--bg:#0A1424;--surface:#111E33;--surface-2:#0E1A2D;--line:#22385A;--ink:#E6EEF8;--muted:#9DB1CA;--royal:#8FB0FF;--green:#5AD394;--green-soft:#123726;--red:#F08A82;--sky:#16304F;
--gloss:linear-gradient(180deg,#4EA8F5 0%,#1E73D0 50%,#173C9E 100%);--display:"Lexend",system-ui,sans-serif;--body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Space Mono",ui-monospace,monospace;color-scheme:dark}
:root[data-theme="light"]{--bg:#EEF5FC;--surface:#fff;--surface-2:#F5F9FE;--line:#D6E3F2;--ink:#0F2341;--muted:#52667F;--royal:#1D4ED8;--green:#1F9D5C;--green-soft:#D9F5E4;--red:#C2413A;--sky:#D7EAFC;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 var(--body)}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{text-decoration:none;display:flex;flex-direction:column;line-height:1.1}
.brand small{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand span{font:700 22px var(--display);background:var(--gloss);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green)}
.sp{flex:1}
button,.btn{font:800 14px var(--body);border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--royal)}
.primary{border:0;color:#fff;background:linear-gradient(180deg,#4FD18B 0%,#1F9D5C 55%,#167A47 100%)}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 34px var(--display);margin:4px 0 4px}
h2{font:700 22px var(--display);margin:22px 0 10px}
.lede{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.center{max-width:520px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.list{display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 220px);overflow:auto;padding-right:4px}
@media (max-width:860px){.list{max-height:none}}
.stu{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.stu:hover{border-color:var(--royal)}
.stu[aria-current="true"]{border-color:var(--green);background:var(--green-soft)}
.stu b{font-weight:900}
.stu .em{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stu .meta{font:12px var(--mono);color:var(--muted)}
input[type=search]{width:100%;font:600 15px var(--body);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;margin-bottom:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.stat b{display:block;font:700 24px var(--display)}
.stat span{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th{font:700 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:800}
td.d{font:12px var(--mono);color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:10px}
.note .when{font-weight:900;color:var(--green);margin-bottom:4px}
.note .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.chip{display:inline-block;font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
.err{color:var(--red);font-weight:800}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
[hidden]{display:none!important}
.ed input,.ed textarea,.addf input,.addn textarea{width:100%;font:600 14.5px var(--body);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px}
.addf{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;margin-bottom:10px;align-items:center}
@media (max-width:700px){.addf{grid-template-columns:1fr}}
.addn{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.addn textarea,.note textarea{min-height:110px;resize:vertical}
.ib{all:unset;cursor:pointer;font:700 12px var(--mono);color:var(--muted);padding:3px 8px;border-radius:8px;border:1px solid transparent;white-space:nowrap}
.ib:hover{color:var(--ink);border-color:var(--line)}
.ib.del:hover,.ib.sure{color:#fff;background:#C2413A;border-color:#C2413A}
td.act{white-space:nowrap;text-align:right}
.sortb{all:unset;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit}
.sortb:hover{color:var(--ink)}
.sortb:focus-visible{outline:2px solid var(--royal);border-radius:4px}
.note .nh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.by{font:11px var(--mono);color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:-4px 0 12px}

.parkbox{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:14px 0}
.news{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin:0 0 18px;background:var(--surface)}
.news-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.news-top button{border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 12px;font:700 13px var(--body);cursor:pointer}
.news-n{font:800 12px var(--body);background:#E5533D;color:#fff;border-radius:999px;padding:2px 8px;vertical-align:3px}
.news-list{list-style:none;margin:0;padding:0}
.news-row{display:flex;align-items:center;gap:8px}
.news-row .news-i{flex:1;min-width:0}
.kd-btn{border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 11px;font:700 12.5px var(--body);cursor:pointer;white-space:nowrap}
.kd-btn:hover{border-color:var(--green)}
.kd-done{color:var(--green);font:700 12.5px var(--body);white-space:nowrap;padding:0 8px}
.kd-comp{margin:6px 0 12px 34px;display:flex;flex-direction:column;gap:8px}
.kd-comp textarea{width:100%;box-sizing:border-box;font:500 14.5px var(--body);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:600px){.news-row{flex-wrap:wrap}.kd-comp{margin-left:0}}
.news-i{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px}
.news-i:hover{background:var(--surface-2)}
.news-i:focus-visible{outline:3px solid var(--green)}
.news-list .fresh .news-i{background:var(--green-soft)}
.news-list .big .ni{transform:scale(1.2)}
.ni{font-size:18px;flex:none;width:24px;text-align:center}
.nd{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.foot-link{background:none;border:0;color:var(--royal);text-decoration:underline;cursor:pointer;font:600 13.5px var(--body);padding:4px 0}
.bcard{display:flex;gap:12px;align-items:center;margin-top:8px}
.bsvg{width:72px;height:79px;image-rendering:pixelated;flex:none;background:color-mix(in srgb,var(--green) 10%,var(--surface));border-radius:12px}
.seg{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:700 13.5px var(--body);cursor:pointer}
.seg[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--surface))}
.pstbl{border-collapse:collapse;margin-top:8px;width:100%;max-width:560px}.pstbl td{padding:4px 8px 4px 0;font-size:14px;vertical-align:middle}.pstars{color:#F5B301;letter-spacing:1px}.pstars span{color:#ccc}
</style>
<link rel="stylesheet" href="comfort.css?v=12">
<script>(function(){var t="dark";try{t=localStorage.getItem("ncs-theme")||"dark";if(t==="soft")t="sepia";}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>

<script>(function(){try{var s=JSON.parse(localStorage.getItem("ncs-comfort")||"{}"),r=document.documentElement;if(s.size)r.style.setProperty("--cs-zoom",s.size);if(s.calm)r.classList.add("cs-calm");if(s.space)r.classList.add("cs-space");if(localStorage.getItem("cs-tfocus")==="1")r.classList.add("cs-focus");if(s.inshort===false)r.classList.add("cs-no-inshort");if(s.read===false)r.classList.add("cs-no-read");if(s.font&&s.font!=="default")r.classList.add("cs-font-"+s.font);}catch(e){}})();</script>
<script src="comfort.js?v=14" defer></script>
</head>
<body>
<style>
:root{--c-green:#3DDC97;--c-amber:#FFB547;--c-sky:#5AB8FF;--c-violet:#B18CFF;--c-pink:#FF7EB6;--c-teal:#2DD4BF;--c-coral:#FF8A65;--c-red:#FF6B6B}
:root[data-theme="light"],:root[data-theme="sepia"],:root[data-theme="unicorn"]{--c-green:#12935C;--c-amber:#B86E00;--c-sky:#1C6FD1;--c-violet:#7348D8;--c-pink:#C2306F;--c-teal:#0E8C7E;--c-coral:#C4502B;--c-red:#C93A3A}
@media (min-width:861px){.layout{grid-template-columns:340px minmax(0,1fr)}}
@media (max-width:640px){header .tag,#saving{display:none}.top{gap:8px;padding:8px 12px}.brand span{font-size:18px}header .btn{padding:6px 10px;font-size:13px}}
.tint{--k:var(--c-sky);background:color-mix(in srgb,var(--k) 14%,var(--surface));border:1.5px solid color-mix(in srgb,var(--k) 45%,var(--line))}
.k-green{--k:var(--c-green)}.k-amber{--k:var(--c-amber)}.k-sky{--k:var(--c-sky)}.k-violet{--k:var(--c-violet)}.k-pink{--k:var(--c-pink)}.k-teal{--k:var(--c-teal)}.k-coral{--k:var(--c-coral)}.k-red{--k:var(--c-red)}
.kc{color:var(--k)}
h1.hubt{background:linear-gradient(90deg,var(--c-sky),var(--c-violet) 45%,var(--c-pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.tint b{color:var(--k)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 16px}
.kpi{border-radius:16px;padding:12px 14px}
.kpi .kl{font:700 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--k)}
.kpi .kv{font:800 26px var(--display);margin:2px 0 0}
.kpi .ks{font-size:13px;color:var(--muted)}
.up{color:var(--c-green);font-weight:800}.down{color:var(--c-red);font-weight:800}
.panel{border-radius:16px;padding:14px 16px;margin:0 0 16px}
.panel h2{margin:0 0 8px;font-size:20px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:900px){.two{grid-template-columns:1fr}}
.mbars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.mbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font:11px var(--mono);color:var(--muted);height:100%;justify-content:flex-end}
.mbars i{display:block;width:100%;max-width:42px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,var(--c-green),var(--c-teal))}
.mbars div.now i{background:linear-gradient(180deg,var(--c-amber),var(--c-coral))}
.exp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exp li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--surface-2);font-size:14px}
.exp .when{font:700 12px var(--mono);color:var(--c-amber);min-width:62px}
.exp .amt{margin-left:auto;font-weight:800;color:var(--c-green);white-space:nowrap}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.seg[aria-pressed="true"]{border-color:var(--k,var(--green));background:color-mix(in srgb,var(--k,var(--green)) 20%,var(--surface));color:var(--ink)}
.stu{border-left:6px solid var(--pc,var(--line))!important;flex-direction:row!important;align-items:center;gap:10px!important}
.stu .sb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--display);color:#0b1220;background:var(--av)}
.stu .bar{height:6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:4px}
.stu .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-green),var(--c-teal))}
.stu .bar i.low{background:var(--c-amber)}.stu .bar i.out{background:var(--c-red)}
.badge{display:inline-block;font:800 11px var(--body);padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;border:1px solid var(--line)}
.badge.warn{background:var(--c-amber);color:#2a1800;border-color:transparent}.badge.bad{background:var(--c-red);color:#fff;border-color:transparent}
.badge.half{background:color-mix(in srgb,var(--c-violet) 25%,transparent);border-color:var(--c-violet)}.badge.tq{background:color-mix(in srgb,var(--c-teal) 25%,transparent);border-color:var(--c-teal)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 14px}
.dh{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dh h2{margin:0;flex:1;min-width:200px}
.chipb{all:unset;cursor:pointer;font:700 12.5px var(--mono);padding:4px 10px;border-radius:999px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}@media (max-width:700px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld textarea,.fld select,.frm input,.frm select,.frm textarea,#detail select{font:600 14.5px var(--body);color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;width:100%;box-sizing:border-box}
.fld textarea{min-height:90px;resize:vertical}
.frm{display:grid;gap:8px;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;border-radius:14px;padding:12px;margin-bottom:14px}
.frm .w2{grid-column:span 2}.frm .w3{grid-column:span 3}.frm .w6{grid-column:1/-1}
@media (max-width:760px){.frm{grid-template-columns:1fr 1fr}.frm .w2,.frm .w3{grid-column:1/-1}}
.pk{border:1.5px solid var(--line);border-left:8px solid var(--pc,var(--line));border-radius:14px;padding:12px 14px;margin-bottom:10px;background:color-mix(in srgb,var(--pc,var(--surface)) 9%,var(--surface))}
.pk .pbar{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin:8px 0 4px}
.pk .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-green),var(--c-teal))}
.pk.old{opacity:.72}.pk select{width:auto!important;max-width:240px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tbl table{min-width:640px}
td.sw{width:6px;padding:0;background:var(--pc,transparent)}
tr.nt td{font-style:italic;color:var(--muted);font-weight:600}
tr.arch td{opacity:.85}
.att{font:700 11.5px var(--body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.att.Present{background:color-mix(in srgb,var(--c-green) 18%,transparent);color:var(--c-green)}
.att.Absent,.att.Late{background:color-mix(in srgb,var(--c-red) 18%,transparent);color:var(--c-red)}
.att.Cancelled{background:color-mix(in srgb,var(--c-amber) 18%,transparent);color:var(--c-amber)}
.hr{font:700 11.5px var(--mono)}.hr.Priority{color:var(--c-pink)}.hr.Standard{color:var(--c-sky)}
.alerts{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.alerts li{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;border-left:4px solid var(--k);background:color-mix(in srgb,var(--k) 10%,var(--surface-2))}
.alerts li button{margin-left:auto}
.ai{font-size:17px;width:22px;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .card{width:min(640px,100%);max-height:90vh;overflow:auto}
.small{font-size:13px}.linkb{color:var(--c-sky);font-weight:700}
.saving{font:12px var(--mono);color:var(--muted)}
.eng{display:inline-flex;align-items:center;gap:6px;font:800 13px var(--body);padding:4px 10px;border-radius:999px}
.sortrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.nextc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.nextc li{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.nextc .t{font:700 12.5px var(--mono);color:var(--c-sky)}
.prof{white-space:pre-wrap;line-height:1.55}
</style>
<header><div class="top">
  <a class="brand" href="./"><small>Learn with Noa</small><span>Cheat Sheet</span></a>
  <span class="tag">Student hub</span>
  <a class="btn" href="teacher.html" style="margin-left:6px">← Teacher view</a>
  <div class="sp"></div>
  <span class="saving" id="saving"></span>
  <div class="cs-wrap" id="csWrap"></div>
  <button id="outBtn" type="button" hidden>Sign out</button>
</div></header>
<main>
  <section id="vSign" class="card center" hidden>
    <h1>Student hub</h1>
    <p class="lede">Sign in with your Learn with Noa Google account.</p>
    <button class="primary" id="inBtn" type="button">Sign in with Google</button>
    <p class="err" id="signErr" hidden></p>
  </section>
  <section id="vDenied" class="card center" hidden>
    <h1>This page is only for Noa</h1>
    <p class="lede">You're signed in as <b id="deniedWho"></b>.</p>
  </section>
  <section id="vMain" hidden>
    <div class="dh"><h1 class="hubt" style="flex:1;margin:0">Your private students</h1>
      <div class="row"><button type="button" class="primary" id="addStu">＋ New student</button>
      <button type="button" id="impBtn">⬆ Import file</button><button type="button" id="expBtn">⬇ Backup</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden></div></div>
    <p class="lede" id="summary" style="margin-top:6px">Loading…</p>
    <div class="kpis" id="kpis"></div>
    <div class="tint k-sky panel" id="nextBox" hidden></div>
    <div class="tint k-amber panel" id="alertsBox" hidden></div>
    <div class="two">
      <div class="tint k-green panel" id="moneyBox"></div>
      <div class="tint k-violet panel" id="expBox"></div>
    </div>
    <div class="layout">
      <div>
        <input type="search" id="q" placeholder="Search students…" aria-label="Search students">
        <div class="filters" id="filters"></div>
        <div class="list" id="list"></div>
      </div>
      <div id="detail" class="card"><p class="muted">Pick a student on the left.</p></div>
    </div>
  </section>
  <p class="err" id="loadErr" hidden></p>
</main>
<div id="modal" class="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import { initializeApp, getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup, signInWithRedirect, signOut,
  getFirestore, collection, getDocs, getDoc, doc, setDoc, deleteDoc, serverTimestamp } from "./fb.js?v=12.19.0c";
import { COUNTS, STD_PRICE, today, addDays, days, packStats, deadline, curPack, lastClass, makeView } from "./hubview.js?v=1";
const TEACHER = "learnwithnoa@gmail.com";
const app = initializeApp({
  apiKey: "AIzaSyAPhkFh-6mMzlILQh_-RVq6aJJ2o2Q7Raw",
  authDomain: "learnwithnoa-cheatsheet.firebaseapp.com",
  projectId: "learnwithnoa-cheatsheet",
  storageBucket: "learnwithnoa-cheatsheet.firebasestorage.app",
  messagingSenderId: "619847241160",
  appId: "1:619847241160:web:d66edc58b7b143b9ab04fd"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const views = ["vSign", "vDenied", "vMain"];
const showView = v => views.forEach(id => $(id).hidden = id !== v);
function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2400); }
$("inBtn").onclick = async () => {
  const p = new GoogleAuthProvider(); p.setCustomParameters({ prompt: "select_account" });
  try { await signInWithPopup(auth, p); }
  catch (e) { if (e && e.code === "auth/popup-blocked") await signInWithRedirect(auth, p); else if (e && e.code !== "auth/popup-closed-by-user") { $("signErr").hidden = false; $("signErr").textContent = "Sign-in didn't work. Try again."; } }
};
$("outBtn").onclick = () => signOut(auth);

/* ---------- state ---------- */
let tUid = null, S = [], cur = null, tab = "classes", filt = "active", editRow = null, clsSort = -1, wSort = "new", roles = {}, usage = {}, meta = null;
const PRE = "t-hub-";
const fmtD = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); };
const fmtShort = iso => { if (!iso) return ""; const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" }); };
const clp = n => "$" + Math.round(n).toLocaleString("es-CL");
const pl = (n, w) => n + " " + w + (n === 1 ? "" : /(s|ss|sh|ch|x)$/.test(w) ? "es" : "s");
const uid = () => Math.random().toString(36).slice(2, 9);
const PCOLORS = ["#d5a6bd", "#b4a7d6", "#9fc5e8", "#a4c2f4", "#a2c4c9", "#b6d7a8", "#ffe599", "#f9cb9c", "#ea9999", "#c8daf8"];
const AV = ["#3DDC97", "#FFB547", "#5AB8FF", "#B18CFF", "#FF7EB6", "#2DD4BF", "#FF8A65", "#F5D547"];
const avc = s => AV[[...s.id].reduce((n, c) => n + c.charCodeAt(0), 0) % AV.length];
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const money = v => { const n = typeof v === "number" ? v : +String(v || "").replace(/[^\d]/g, ""); return n || 0; };
const weekStart = iso => { const [y, m, d] = iso.split("-").map(Number); const t = new Date(y, m - 1, d); const k = (t.getDay() + 6) % 7; return addDays(iso, -k); };

async function load() {
  $("summary").textContent = "Loading…";
  tUid = auth.currentUser.uid;
  try {
    const [ds, rs] = await Promise.all([getDocs(collection(db, "users", tUid, "data")), getDocs(collection(db, "roles")).catch(() => null)]);
    S = []; meta = null;
    ds.forEach(x => { const v = x.data(); if (v.deleted || typeof v.json !== "string") return;
      if (x.id === "t-hubmeta") { try { meta = JSON.parse(v.json); } catch (e) {} return; }
      if (!x.id.startsWith(PRE)) return; try { S.push(JSON.parse(v.json)); } catch (e) {} });
    roles = {}; if (rs) rs.forEach(d => { const r = d.data() || {}; if (r.hub) roles[r.hub] = { uid: d.id, ...r }; });
    S.forEach(norm);
    S.forEach(s => { const r = roles[s.id]; if (r && s.uid !== r.uid) { s.uid = r.uid; save(s, true); } });
    renderAll();
    loadUsage();
    publishAll();
    saveIds();
  } catch (e) { console.error(e); $("loadErr").hidden = false; $("loadErr").textContent = "Couldn't load your students. Refresh to try again."; }
}
async function loadUsage() {
  const linked = S.filter(s => s.uid);
  await Promise.all(linked.map(async s => { try { const d = await getDoc(doc(db, "users", s.uid, "data", "ncs-usage")); usage[s.id] = d.exists() ? JSON.parse(d.data().json || "{}") || {} : {}; } catch (e) {} }));
  renderList(); renderDetail();
}
function norm(s) {
  s.packs = s.packs || []; s.classes = s.classes || []; s.payments = s.payments || []; s.words = s.words || []; s.other = s.other || []; s.info = s.info || {};
  s.classes.forEach(c => { if (!c.id) c.id = uid(); });
  s.payments.forEach(p => { if (!p.id) p.id = uid(); });
}
const pending = new Map();
function save(s, quiet) {
  if (!quiet) s.updatedAt = Date.now();
  clearTimeout(pending.get(s.id)); $("saving").textContent = "Saving…";
  pending.set(s.id, setTimeout(async () => {
    pending.delete(s.id);
    try { await setDoc(doc(db, "users", tUid, "data", PRE + s.id), { json: JSON.stringify(s), deleted: false, at: serverTimestamp() }); publish(s); if (!pending.size) $("saving").textContent = "Saved ✓"; }
    catch (e) { console.error(e); $("saving").textContent = "Not saved!"; toast("Couldn't save. Check your connection."); }
  }, 600));
}
/* the student's read-only copy */
const vh = s => { const v = makeView(s); delete v.updated; return JSON.stringify(v); };
async function publish(s, force) {
  if (!s.uid) return;
  const j = vh(s), key = "cs-hubpub-" + s.id; let last = null; try { last = localStorage.getItem(key); } catch (e) {}
  if (!force && last === j) return;
  try { await setDoc(doc(db, "users", s.uid, "data", "hub-view"), { json: JSON.stringify(makeView(s)), deleted: false, at: serverTimestamp() }); try { localStorage.setItem(key, j); } catch (e) {} }
  catch (e) { console.warn("publish", e); }
}
function publishAll() { S.forEach(s => publish(s)); }
/* the nightly helper finds students through this list */
function saveIds() { const ids = S.map(s => s.id).sort(); if (meta && JSON.stringify(meta.ids || []) === JSON.stringify(ids)) return; meta = Object.assign({}, meta || {}, { ids }); setDoc(doc(db, "users", tUid, "data", "t-hubmeta"), { json: JSON.stringify(meta), deleted: false, at: serverTimestamp() }).catch(e => console.warn("ids", e)); }
window.addEventListener("beforeunload", e => { if (pending.size) { e.preventDefault(); e.returnValue = ""; } });

/* ---------- maths ---------- */
function instAt(p, st) { if (p.size === 36) return st.pri ? 5 : 7; if (p.size === 72) return st.pri ? 9 : 12; return null; }
function gap(s) { const ds = s.classes.filter(c => c.kind !== "note" && c.date && COUNTS.has(c.att || "Present")).map(c => c.date).sort().slice(-7); if (ds.length < 2) return 7; const g = []; for (let i = 1; i < ds.length; i++) g.push(days(ds[i - 1], ds[i])); g.sort((a, b) => a - b); return Math.max(2, Math.min(14, g[Math.floor(g.length / 2)] || 7)); }
function nextGuess(s) { const lc = lastClass(s) || today(); let n = addDays(lc, gap(s)); if (n < today()) n = addDays(today(), 1); return n; }
function packPrice(p) { const n = money(p.price); if (n) return n; return STD_PRICE[p.size] || 0; }
function alertsFor(s) {
  const out = []; if (s.status !== "active") return out;
  const p = curPack(s);
  if (p && s.kind !== "trueque" && p.size) {
    const st = packStats(s, p);
    if (st.left <= 0) out.push({ lvl: "bad", i: "🔴", t: `${s.name}: pack used up (${st.used}/${st.size}) · renewal due 48h before the next class` });
    else if (st.classesLeft <= 1) out.push({ lvl: "warn", i: "🟠", t: `${s.name}: ${st.classesLeft === 1 ? "1 class left" : "less than a class left"} (${st.left} ${p.unit})` });
    if (p.paid === "half") { const at = instAt(p, st); if (at && st.done + 1 >= at) out.push({ lvl: st.done >= at ? "bad" : "warn", i: "💸", t: `${s.name}: 2nd installment due at class ${at} (${st.done} done)` }); }
    if (p.paid === "pending") out.push({ lvl: "bad", i: "💸", t: `${s.name}: pack not paid yet` });
    const dl = deadline(p, st.first); if (dl) { const d = days(today(), dl); if (d < 0 && st.left > 0) out.push({ lvl: "bad", i: "⏰", t: `${s.name}: pack expired ${fmtShort(dl)} with ${st.left} ${p.unit} unused` }); else if (d >= 0 && d <= 7 && st.left > 0) out.push({ lvl: "warn", i: "⏰", t: `${s.name}: pack ends ${fmtShort(dl)} (${d === 0 ? "today" : d === 1 ? "tomorrow" : "in " + d + " days"}), ${st.left} ${p.unit} left` }); }
  }
  const lc = lastClass(s); if (lc && days(lc, today()) >= 14) out.push({ lvl: "info", i: "💤", t: `${s.name}: no class since ${fmtShort(lc)}` });
  return out.map(a => ({ ...a, id: s.id }));
}
function engagement(s) {
  const since = addDays(today(), -60);
  const cl = s.classes.filter(c => c.kind !== "note" && c.date >= since);
  const att = cl.filter(c => COUNTS.has(c.att || "Present")), pres = att.filter(c => (c.att || "Present") === "Present").length;
  const parts = []; let score = 0, max = 0;
  if (att.length) { const r = pres / att.length; score += r * 40; max += 40; parts.push(`attendance ${Math.round(r * 100)}%`); }
  const lc = lastClass(s); if (lc) { const d = days(lc, today()); score += d <= 7 ? 30 : d <= 14 ? 20 : d <= 21 ? 10 : 0; max += 30; parts.push(`last class ${d === 0 ? "today" : pl(d, "day") + " ago"}`); }
  if (s.uid) { const u = usage[s.id] || {}; const act = Object.keys(u).filter(k => k >= addDays(today(), -14) && Object.values(u[k] || {}).some(v => v > 0)).length; score += act >= 5 ? 30 : act >= 2 ? 20 : act >= 1 ? 10 : 0; max += 30; parts.push(`Cheat Sheet ${pl(act, "day")} in 2 weeks`); }
  if (!max) return null;
  const pct = Math.round(score / max * 100);
  return { pct, lvl: pct >= 75 ? "High" : pct >= 50 ? "Medium" : "Low", k: pct >= 75 ? "k-green" : pct >= 50 ? "k-amber" : "k-red", parts };
}
function weekStats(off) {
  const ws = addDays(weekStart(today()), -7 * off), we = addDays(ws, 7);
  let n = 0; S.forEach(s => s.classes.forEach(c => { if (c.kind !== "note" && c.date >= ws && c.date < we && (c.att || "Present") === "Present") n++; }));
  return n;
}
function monthStats() {
  const m = today().slice(0, 7); const r = { abs: 0, late: 0, ontime: 0, n: 0 };
  S.forEach(s => s.classes.forEach(c => { if (c.kind === "note" || !(c.date || "").startsWith(m)) return; r.n++; if (c.att === "Absent") r.abs++; else if (c.att === "Late cancellation") r.late++; else if (c.att === "Cancelled on time") r.ontime++; }));
  return r;
}
function earned() {
  const by = {}; let usd = 0, usdY = 0; const y = today().slice(0, 4);
  S.forEach(s => s.payments.forEach(p => { if (!p.date) return; const mo = p.date.slice(0, 7); if (p.cur === "USD") { if (mo === today().slice(0, 7)) usd += money(p.clp ?? p.amount); if (p.date.startsWith(y)) usdY += money(p.clp ?? p.amount); return; } const v = money(p.clp ?? p.amount); if (v) by[mo] = (by[mo] || 0) + v; }));
  return { by, usd, usdY };
}
function expected() {
  const out = [];
  S.forEach(s => {
    if (s.status !== "active" || s.kind === "trueque") return;
    const p = curPack(s); if (!p || !p.size) return;
    const st = packStats(s, p), g = gap(s), nx = nextGuess(s), price = packPrice(p);
    if (p.paid === "pending") out.push({ d: today(), s, t: "Pack payment", v: price });
    if (p.paid === "half") { const at = instAt(p, st); if (at) out.push({ d: addDays(nx, Math.max(0, at - 1 - st.done) * g), s, t: "2nd installment", v: Math.round(price / 2) }); }
    const left = Math.max(0, st.classesLeft || 0); out.push({ d: addDays(nx, Math.max(0, left) * g - 2), s, t: "Renewal" + (left ? ` (after ${pl(left, "class")})` : ""), v: STD_PRICE[p.size] || price, guess: true });
  });
  out.forEach(x => { if (x.d < today()) x.d = today(); });
  return out.filter(x => x.d <= addDays(today(), 45)).sort((a, b) => a.d.localeCompare(b.d));
}

/* ---------- render ---------- */
function renderAll() { renderSummary(); renderKpis(); renderNext(); renderAlerts(); renderMoney(); renderFilters(); renderList(); renderDetail(); }
function renderSummary() {
  const act = S.filter(s => s.status === "active");
  $("summary").textContent = `${act.length} active students · ${S.length} students in total`;
}
function renderKpis() {
  const tw = weekStats(0), lw = weekStats(1), ms = monthStats(), e = earned(), mo = today().slice(0, 7);
  const diff = tw - lw, arrow = diff > 0 ? `<span class="up">▲ ${diff}</span>` : diff < 0 ? `<span class="down">▼ ${-diff}</span>` : "same as";
  const exp30 = expected().filter(x => x.d <= addDays(today(), 30)).reduce((n, x) => n + x.v, 0);
  $("kpis").innerHTML = `
    <div class="kpi tint k-sky"><div class="kl">This week</div><div class="kv">${pl(tw, "class")}</div><div class="ks">≈ ${(tw * 0.75).toFixed(1).replace(".0", "")} h taught · ${arrow} ${diff ? "vs" : ""} last week (${lw})</div></div>
    <div class="kpi tint k-green"><div class="kl">Paid this month</div><div class="kv">${clp(e.by[mo] || 0)}</div><div class="ks">${e.usd ? "+ US$" + e.usd + " · " : ""}${clp(Object.entries(e.by).filter(([k]) => k.startsWith(mo.slice(0, 4))).reduce((n, [, v]) => n + v, 0))} this year</div></div>
    <div class="kpi tint k-violet"><div class="kl">Expected · next 30 days</div><div class="kv">${clp(exp30)}</div><div class="ks">installments + likely renewals</div></div>
    <div class="kpi tint k-coral"><div class="kl">This month</div><div class="kv">${pl(ms.n - ms.abs - ms.late - ms.ontime, "class")}</div><div class="ks">${ms.late} late cancel · ${ms.abs} no-show · ${ms.ontime} on-time cancel</div></div>`;
}
function renderNext() {
  const box = $("nextBox"); const up = meta && Array.isArray(meta.upcoming) ? meta.upcoming.filter(u => (u.start || "") >= new Date(Date.now() - 3600e3).toISOString()).slice(0, 12) : [];
  box.hidden = !up.length; if (!up.length) return;
  box.innerHTML = `<h2><span class="kc">📅</span> Coming up</h2><ul class="nextc">${up.map(u => { const s = S.find(x => x.id === u.student); const lc = s ? s.classes.filter(c => c.kind !== "note").slice(-1)[0] : null; const t = new Date(u.start);
    return `<li><span class="t">${t.toLocaleDateString("en-US", { weekday: "short" })} ${t.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}</span><span><b>${esc(s ? s.name : u.name || "")}</b>${lc ? `<span class="muted small"> · last time: ${esc(lc.topics)}${lc.homework ? " · homework: " + esc(lc.homework) : ""}</span>` : ""}</span></li>`; }).join("")}</ul>`;
}
function renderAlerts() {
  const al = S.flatMap(alertsFor).sort((a, b) => ({ bad: 0, warn: 1, info: 2 }[a.lvl] - { bad: 0, warn: 1, info: 2 }[b.lvl]));
  const box = $("alertsBox"); box.hidden = !al.length;
  const K = { bad: "var(--c-red)", warn: "var(--c-amber)", info: "var(--c-sky)" };
  box.innerHTML = `<h2>🔔 Heads-up <span class="news-n">${al.length}</span></h2><ul class="alerts">${al.map(a => `<li style="--k:${K[a.lvl]}"><span class="ai">${a.i}</span><span>${esc(a.t)}</span><button type="button" class="ib" data-open="${a.id}">Open</button></li>`).join("")}</ul>`;
}
function renderMoney() {
  const e = earned(); const ms = []; for (let i = 5; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); ms.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); }
  const mx = Math.max(1, ...ms.map(m => e.by[m] || 0)), now = today().slice(0, 7);
  $("moneyBox").innerHTML = `<h2>💰 Money in</h2><div class="muted small">Pesos received per month (payments with an amount; ≈ = estimated from the pack price)</div>
    <div class="mbars">${ms.map(m => `<div class="${m === now ? "now" : ""}" title="${clp(e.by[m] || 0)}"><span>${(e.by[m] || 0) ? Math.round((e.by[m] || 0) / 1000) + "k" : ""}</span><i style="height:${Math.round((e.by[m] || 0) / mx * 80)}px"></i>${new Date(m + "-15").toLocaleDateString("en-US", { month: "short" })}</div>`).join("")}</div>
    ${e.usdY ? `<p class="muted small" style="margin:8px 0 0">Plus US$${e.usdY} in dollars this year.</p>` : ""}`;
  const ex = expected();
  $("expBox").innerHTML = `<h2>📆 Coming in</h2><div class="muted small">Second installments and likely renewals, guessed from each student's pace</div>
    <ul class="exp" style="margin-top:8px">${ex.slice(0, 10).map(x => `<li><span class="when">${fmtShort(x.d)}</span><span><b>${esc(x.s.name)}</b> <span class="muted">· ${esc(x.t)}</span></span><span class="amt">${x.guess ? "≈" : ""}${clp(x.v)}</span></li>`).join("") || `<li class="muted">Nothing expected in the next 45 days.</li>`}</ul>`;
}
function renderFilters() {
  const n = k => k === "all" ? S.length : S.filter(s => s.status === k).length;
  $("filters").innerHTML = [["active", "Active", "k-green"], ["paused", "Paused", "k-amber"], ["inactive", "Past", "k-violet"], ["all", "All", "k-sky"]].map(([k, l, c]) => `<button type="button" class="seg ${c}" data-f="${k}" aria-pressed="${filt === k}">${l} ${n(k)}</button>`).join("");
}
function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const ls = S.filter(s => (filt === "all" || s.status === filt) && (!q || (s.name + " " + (s.email || "")).toLowerCase().includes(q)))
    .sort((a, b) => (lastClass(b) || "").localeCompare(lastClass(a) || "") || a.name.localeCompare(b.name));
  $("list").innerHTML = ls.map(s => {
    const p = curPack(s), st = p ? packStats(s, p) : null, al = alertsFor(s), en = engagement(s);
    const pct = st && st.size ? Math.min(100, st.used / st.size * 100) : 0;
    const cls = st && st.size ? (st.left <= 0 ? "out" : st.classesLeft <= 1 ? "low" : "") : "";
    const bad = al.some(a => a.lvl === "bad"), warn = al.some(a => a.lvl === "warn");
    return `<button class="stu" data-s="${s.id}" aria-current="${cur === s.id}" style="--pc:${p && p.color || "var(--line)"}"><span class="av" style="--av:${avc(s)}">${esc(initials(s.name))}</span><span class="sb"><b>${esc(s.name)}${bad ? '<span class="badge bad">!</span>' : warn ? '<span class="badge warn">!</span>' : ""}${p && p.paid === "half" ? '<span class="badge half">½ paid</span>' : ""}${s.kind === "trueque" ? '<span class="badge tq">trueque</span>' : ""}</b>
      <span class="meta">${en ? `<span class="dot" style="background:var(--${{ "k-green": "c-green", "k-amber": "c-amber", "k-red": "c-red" }[en.k]})" title="Engagement: ${en.lvl}"></span>` : ""}${p && st && st.size ? `${st.used}/${st.size} ${p.unit} · ${pl(st.done, "class")}` : p ? pl(st.done, "class") : "no pack yet"}${lastClass(s) ? " · last " + fmtShort(lastClass(s)) : ""}</span>
      ${st && st.size ? `<span class="bar"><i class="${cls}" style="width:${pct}%"></i></span>` : ""}</span></button>`;
  }).join("") || `<p class="muted">No students here.</p>`;
}
const S_ = () => S.find(s => s.id === cur);
const TABS = [["classes", "Classes", "k-sky"], ["packs", "Packs & payments", "k-green"], ["info", "Profile", "k-violet"], ["words", "Word bank", "k-amber"]];
function renderDetail() {
  const s = S_(); const box = $("detail");
  if (!s) { box.innerHTML = `<p class="muted">Pick a student on the left.</p>`; return; }
  const p = curPack(s), st = p ? packStats(s, p) : null, en = engagement(s), r = roles[s.id];
  const links = [s.sheetId ? `<a class="linkb" target="_blank" rel="noopener" href="https://docs.google.com/spreadsheets/d/${esc(s.sheetId)}/edit">English Journey ↗</a>` : "", s.folderId ? `<a class="linkb" target="_blank" rel="noopener" href="https://drive.google.com/drive/folders/${esc(s.folderId)}">Drive folder ↗</a>` : "", s.email ? `<a class="linkb" href="mailto:${esc(s.email)}">${esc(s.email)}</a>` : ""].filter(Boolean).join(" · ");
  const tabs = TABS.concat(s.other.length ? [["other", "Other tabs", "k-teal"]] : []);
  box.innerHTML = `<div class="dh"><span class="av" style="--av:${avc(s)};width:44px;height:44px;font-size:16px">${esc(initials(s.name))}</span><h2>${esc(s.name)}</h2>
    ${s.boleta ? `<button class="chipb tint k-amber" data-copy="${esc(s.boleta)}" title="Copy for the SII">🧾 Boleta ${esc(s.boleta)}</button>` : ""}
    <select id="stStatus" aria-label="Status" style="width:auto">${["active", "paused", "inactive"].map(k => `<option value="${k}" ${s.status === k ? "selected" : ""}>${{ active: "🟢 Active", paused: "⏸ Paused", inactive: "📦 Past student" }[k]}</option>`).join("")}</select></div>

};
$("modal").addEventListener("click", e => { if (e.target.id === "modal") $("modal").hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modal").hidden) $("modal").hidden = true; });
$("expBtn").onclick = () => {
  const blob = new Blob([JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), students: S }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "student-hub-backup-" + today() + ".json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
};
$("impBtn").onclick = () => $("impFile").click();
$("impFile").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch (err) { toast("That file isn't a hub file"); return; }
  const list = Array.isArray(data) ? data : data.students; if (!Array.isArray(list)) { toast("That file isn't a hub file"); return; }
  const clash = list.filter(x => S.some(s => s.id === x.id)).length;
  const m = $("modal"); m.hidden = false;
  m.innerHTML = `<div class="card"><h2 style="margin-top:0">Import ${list.length} students?</h2><p>${clash ? `${clash} of them are already in the hub. Importing replaces them with the version in the file.` : "None of them are in the hub yet."}</p><div class="row" style="justify-content:flex-end"><button type="button" id="mClose">Cancel</button><button type="button" class="primary" id="mGo">Import</button></div></div>`;
  $("mClose").onclick = () => m.hidden = true;
  $("mGo").onclick = async () => {
    $("mGo").disabled = true; $("mGo").textContent = "Importing…";
    try {
      for (const x of list) { norm(x); const old = S.find(s => s.id === x.id); if (old && old.uid && !x.uid) x.uid = old.uid; if (roles[x.id]) x.uid = roles[x.id].uid; await setDoc(doc(db, "users", tUid, "data", PRE + x.id), { json: JSON.stringify(x), deleted: false, at: serverTimestamp() }); const i = S.findIndex(s => s.id === x.id); if (i >= 0) S[i] = x; else S.push(x); }
      m.hidden = true; renderAll(); publishAll(); saveIds(); loadUsage(); toast(`Imported ${list.length} students`);
    } catch (err) { console.error(err); toast("Import stopped: couldn't save. Try again."); $("mGo").disabled = false; $("mGo").textContent = "Import"; }
  };
};
onAuthStateChanged(auth, u => {
  $("outBtn").hidden = !u;
  if (!u) { showView("vSign"); return; }
  if ((u.email || "").toLowerCase() !== TEACHER) { $("deniedWho").textContent = u.email || u.displayName || "another account"; showView("vDenied"); return; }
  showView("vMain"); load();
});
</script>
</body>
